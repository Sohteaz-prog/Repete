<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf7f2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Répète">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Répète — apprendre son texte de théâtre</title>
<style>
/* 2.03 (D9) : échelle commune des tailles de texte et des arrondis */
:root{--fs-11:11px;--fs-12:12px;--fs-13:13px;--fs-14:14px;--fs-15:15px;--fs-16:16px;--fs-18:18px;--fs-20:20px;--fs-22:22px;--fs-24:24px;--fs-28:28px;--fs-30:30px;--fs-32:32px;--fs-38:38px;--fs-40:40px;--fs-44:44px;--fs-46:46px;--r-4:4px;--r-6:6px;--r-8:8px;--r-10:10px;--r-12:12px;--r-14:14px;--r-16:16px;--r-20:20px;--r-999:999px}

:root{
  --bg:#faf7f2;--card:#ffffff;--ink:#1f1b16;--mute:#645c52;--line:#e6dfd3;
  --accent:var(--al0,#f5a300);--accent-ink:var(--al1,#9a5a00);--accent-bg:var(--al2,#fff1cc);--on-accent:var(--al3,#2a1a00);--ok:#2f6f4f;--ko:#a33a2a;
}
:root{color-scheme:light dark}
/* 2.01 : surlignage de mes répliques (clair renforcé, sombre adouci) et couleur des didascalies */
:root{--me-bg:color-mix(in srgb,var(--accent) 16%,var(--accent-bg));--me-bd:var(--accent);--dir:#2F65A0}
:root[data-dir=sepia]{--dir:#9A4F1E}:root[data-dir=sauge]{--dir:#2F7A4E}
:root[data-theme=dark]{--me-bg:color-mix(in srgb,var(--accent-bg) 75%,var(--card));--me-bd:color-mix(in srgb,var(--accent) 75%,var(--card));--dir:#8DB9EC}
:root[data-theme=dark][data-dir=sepia]{--dir:#E9A877}:root[data-theme=dark][data-dir=sauge]{--dir:#86D3A4}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--me-bg:color-mix(in srgb,var(--accent-bg) 75%,var(--card));--me-bd:color-mix(in srgb,var(--accent) 75%,var(--card));--dir:#8DB9EC}
:root:not([data-theme=light])[data-dir=sepia]{--dir:#E9A877}:root:not([data-theme=light])[data-dir=sauge]{--dir:#86D3A4}}
:root{--st-ko:#E5484D;--st-known:#22A06B;--st-solid:#F2B01E;--st-ring:#A87400}
/* Mode daltonien : autres couleurs + formes (losange = à revoir, rond = connue, étoile = solide) et motifs du liseré */
:root[data-cb=rv]{--st-ko:#D55E00;--st-known:#0072B2;--st-solid:#F0E442;--st-ring:#8A7F00}
:root[data-cb=by]{--st-ko:#B71C1C;--st-known:#00A88F;--st-solid:#FFC400;--st-ring:#7A5C00}
:root[data-cb] .dot.ko{clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);border-radius:0}
:root[data-cb] .dot.solid{clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);border-radius:0;box-shadow:none}
:root[data-cb=rv]{--st-solid:#C99700}
:root[data-cb=by]{--st-solid:#D19A00}
:root[data-theme=dark][data-cb=rv]{--st-solid:#F0E442}
:root[data-theme=dark][data-cb=by]{--st-solid:#FFC400}
@media (prefers-color-scheme:dark){:root:not([data-theme=light])[data-cb=rv]{--st-solid:#F0E442}:root:not([data-theme=light])[data-cb=by]{--st-solid:#FFC400}}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
@media (prefers-color-scheme:dark){
  :root:not([data-theme=light]){--bg:#211e1a;--card:#2b2723;--ink:#efe9e0;--mute:#aaa195;--line:#3e3933;--accent:var(--ad0,#f5a300);--accent-ink:var(--ad1,#f5b335);--accent-bg:var(--ad2,#3a2d10);--on-accent:var(--ad3,#2a1a00);--ok:#6fcf9a;--ko:#f0907f;}
}
:root[data-theme=dark]{--bg:#211e1a;--card:#2b2723;--ink:#efe9e0;--mute:#aaa195;--line:#3e3933;--accent:var(--ad0,#f5a300);--accent-ink:var(--ad1,#f5b335);--accent-bg:var(--ad2,#3a2d10);--on-accent:var(--ad3,#2a1a00);--ok:#6fcf9a;--ko:#f0907f;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
.thsw *,.thsw *::before,.thsw *::after{transition:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:640px;margin:0 auto;padding:12px 14px calc(24px + env(safe-area-inset-bottom));min-height:100vh}
button{font:inherit;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:inherit;cursor:pointer;touch-action:manipulation}
html{-webkit-text-size-adjust:100%}
button:disabled{opacity:.4;cursor:default}
h1{font-size:var(--fs-28);margin:18px 0 2px;letter-spacing:-.01em}
h2{font-size:var(--fs-20);margin:0 0 2px}
.sub,.mute{color:var(--mute)}
.sub{margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-14);padding:16px;margin:0 0 14px}
.row{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;
  background:var(--bg);border:1px solid var(--line);border-radius:var(--r-10);padding:12px 14px;margin-top:10px;min-height:48px}
.row span:first-child{font-weight:600}
.row .mute{font-size:var(--fs-13)}
.tip{font-size:var(--fs-13);color:var(--mute);margin-top:16px}

.bar{display:flex;align-items:center;gap:8px;margin:8px 0 10px}
.bt{font-weight:650;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ghost{background:none;border:0;padding:10px 6px;color:var(--accent-ink);font-weight:600;min-height:44px}
.ghost.back{display:inline-flex;align-items:center;justify-content:center;min-width:44px;padding:6px 8px 6px 0;flex:none}

.who{background:var(--card);border:1px solid var(--line);border-radius:var(--r-14);padding:12px 12px 10px;margin-bottom:10px}
.lbl{font-size:var(--fs-12);font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;line-height:1.15;background:var(--bg);
  border:1.5px solid var(--line);border-radius:var(--r-12);padding:8px 14px;min-height:46px;font-weight:650}
.chip small{font-weight:400;color:var(--mute);font-size:var(--fs-12);margin-top:2px}
.chip.on{background:color-mix(in srgb,var(--accent) 9%,var(--bg));border:1.5px solid color-mix(in srgb,var(--accent) 60%,var(--line));color:var(--ink)}
.chip.on small{color:var(--mute);opacity:1}

.tabs{display:flex;background:var(--line);border-radius:var(--r-12);padding:3px;margin-bottom:12px}
.tabs button{flex:1;border:0;background:none;padding:10px;border-radius:var(--r-10);font-weight:650;min-height:44px;color:var(--ink);opacity:.72}
.tabs button.on{background:var(--card);color:var(--ink);opacity:1;box-shadow:0 1px 3px rgba(0,0,0,.12)}

.opts{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.seg{display:flex;border:1.5px solid var(--line);border-radius:var(--r-10);overflow:hidden}
.seg button+button{border-left:1px solid var(--line)}
.seg button{flex:1;border:0;background:var(--card);padding:10px 6px;min-height:44px;font-weight:600;color:var(--ink)}
.seg button.on{background:var(--accent-bg);color:var(--accent-ink);font-weight:700}
.sw{display:flex;align-items:center;gap:10px;min-height:36px;font-size:var(--fs-15)}
.sw{justify-content:space-between;width:100%}
.sw input[type=checkbox]{-webkit-appearance:none;appearance:none;order:2;margin:0 0 0 auto;flex:none;width:44px;height:26px;border-radius:var(--r-12);
  background:color-mix(in srgb,var(--ink) 22%,var(--card));position:relative;cursor:pointer;transition:background .15s}
.sw input[type=checkbox]::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;
  box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left .15s}
.sw input[type=checkbox]:checked{background:var(--accent)}
.sw input[type=checkbox]:checked::after{left:21px}
.sw input[type=checkbox]:disabled{opacity:.4;cursor:default}
.sw input[type=checkbox]:focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px}
.hint{color:var(--mute);font-size:var(--fs-14);margin:6px 2px 12px}
.hint.big{background:var(--card);border:1px dashed var(--line);border-radius:var(--r-12);padding:22px;text-align:center;font-size:var(--fs-16)}

.script{font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;font-size:var(--sfs,18px);line-height:1.55}
.script p{margin:0}
.line{border-left:4px solid transparent;padding:8px 10px 8px 12px;margin:2px 0;border-radius:var(--r-10)}
.line.me{background:var(--me-bg);border-left-color:var(--me-bd)}
.script.nohl .line.me{background:transparent;border-left-color:transparent}
.who2{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font:700 12px system-ui,sans-serif;text-transform:uppercase;
  letter-spacing:.08em;color:var(--mute);margin-bottom:2px}
.line.me .who2{color:var(--mute)}
.line.ps.new{border-left-color:var(--mute)}
.line.ps.ko{border-left-color:var(--st-ko)}
.line.ps.known{border-left-color:var(--st-known)}
.line.ps.solid{border-left-color:var(--st-solid)}
.stg{font-size:var(--fs-11);font-weight:700;color:#B4560A;border:1.5px solid #E8710A;border-radius:var(--r-6);padding:1px 6px;text-transform:none;letter-spacing:0;white-space:nowrap}
.pgl{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:var(--fs-12);color:var(--mute);margin:2px 0 6px}
.pgl .dot{width:9px;height:9px;margin-right:5px;vertical-align:-1px}
.mini{background:none;border:1px solid var(--line);border-radius:var(--r-8);padding:2px 8px;font:600 12px system-ui,sans-serif;
  color:var(--mute);text-transform:none;letter-spacing:0;min-height:28px}
.line.me .mini{border-color:var(--accent);color:var(--accent-ink)}
.dir,.aside{font-style:italic;color:var(--dir)}
.dir{font-size:var(--fs-16);margin:12px 14px;text-align:center;color:var(--dir)}
.cue{font-size:var(--fs-14);color:var(--mute);margin:14px 4px 2px;padding-left:12px;border-left:2px solid var(--line)}
.cue .nm{font:700 11px system-ui,sans-serif;text-transform:uppercase;letter-spacing:.08em;margin-right:6px}
.note{font:13px/1.35 system-ui,sans-serif;color:var(--ko);margin-top:6px}
.mask{width:100%;border:1.5px dashed var(--accent);background:transparent;color:var(--accent-ink);
  border-radius:var(--r-10);padding:14px;font:600 14px system-ui,sans-serif;min-height:48px}

/* répétition */
.prog{height:6px;border-radius:var(--r-4);background:var(--line);overflow:hidden;margin:2px 0 4px}
.prog i{display:block;height:100%;background:var(--accent)}
.pcount{font-size:var(--fs-13);color:var(--mute);margin-bottom:10px;display:flex;justify-content:space-between}
.ctx{font-family:Georgia,serif;font-size:calc(var(--sfs,18px) - 3px);color:var(--mute);margin:0 0 8px;padding-left:12px;border-left:2px solid var(--line)}
.ctx .nm{font:700 11px system-ui,sans-serif;text-transform:uppercase;letter-spacing:.08em;margin-right:6px}
.cur{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r-16);padding:18px 16px;margin:10px 0 14px;
  font-family:Georgia,"Iowan Old Style",serif;font-size:var(--cfs,22px);line-height:1.5}
.cur.me{background:var(--accent-bg);border-color:var(--accent)}
.cur .who2{font-size:var(--fs-12);margin-bottom:8px}
.cur .big{font:600 17px system-ui,sans-serif;color:var(--accent-ink)}
.cur .small{font:14px system-ui,sans-serif;color:var(--mute);margin-top:8px}
.actions{display:flex;gap:10px;position:sticky;bottom:0;padding:10px 0 calc(6px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,var(--bg) 75%,transparent)}
.btn{flex:1;min-height:54px;border-radius:var(--r-14);border:1.5px solid var(--line);background:var(--card);font-weight:700;padding:0 14px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent);flex:2;font-size:var(--fs-18)}
.btn.ok{background:color-mix(in srgb,var(--st-known) 24%,var(--card));border-color:color-mix(in srgb,var(--st-known) 48%,var(--card));color:color-mix(in srgb,var(--st-known) 55%,var(--ink));flex:2}
.btn.ko{background:color-mix(in srgb,var(--st-ko) 24%,var(--card));border-color:color-mix(in srgb,var(--st-ko) 48%,var(--card));color:color-mix(in srgb,var(--st-ko) 55%,var(--ink))}
.gsec{border-bottom:1px solid var(--line)}
.gsh{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:8px 2px;border:0;background:none;text-align:left;color:var(--ink)}
.gsh .ico{color:var(--mute);flex:none}
.gtx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.gt{font-size:var(--fs-16);font-weight:700}
.gs{font-size:var(--fs-13);color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gch{color:var(--mute);flex:none;transition:transform .15s}
.gsec.open .gch{transform:rotate(180deg)}
.gbd{padding:0 2px 16px}
.gbd>.lbl:first-child{margin-top:4px}
.updlk{border:0;background:none;padding:6px 4px;font-size:inherit;font-weight:600;color:var(--mute);text-decoration:underline;min-height:32px}
.btn.sm{min-height:44px;flex:0 0 auto;font-size:var(--fs-14)}
.row2{display:flex;gap:10px;margin-top:10px}
.set{display:flex;flex-direction:column;gap:12px}
.set label.f{display:flex;flex-direction:column;gap:6px;font-size:var(--fs-14);color:var(--mute)}
.set select,.set input[type=range]{width:100%;min-height:40px;font:inherit;border-radius:var(--r-8);border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:0 8px}
.set input[type=range]{padding:0;accent-color:var(--accent)}
.miss{margin:8px 0 0;padding-left:18px;font-size:var(--fs-14);color:var(--mute)}
.modes{display:flex;flex-direction:column;gap:8px}
.mdc{display:flex;align-items:center;gap:12px;width:100%;text-align:left;min-height:58px;padding:10px 12px;border:1.5px solid var(--line);border-radius:var(--r-14);background:var(--card);color:var(--ink)}
.mdc span{display:flex;flex-direction:column}.mdc b{font-size:var(--fs-16)}.mdc small{font-size:var(--fs-13);color:var(--mute)}
.mdc svg{color:var(--mute);flex:none}
.mdc.on{border-color:var(--accent);background:var(--accent-bg)}.mdc.on b,.mdc.on svg{color:var(--accent-ink)}
.fwrap{flex:1;display:flex;flex-direction:column;justify-content:center}
.fcard{perspective:1000px;margin:10px 0 14px;cursor:pointer}
.fface{position:relative}
.cur{position:relative}.cur .who2{padding-right:38px}
.fcard{-webkit-user-select:none;user-select:none}
.fcard.flip{touch-action:pan-y;cursor:grab}
.edge{position:fixed;top:0;bottom:0;width:5px;opacity:0;pointer-events:none;z-index:30}
.edge.l{left:0;background:var(--st-ko);box-shadow:0 0 18px 6px color-mix(in srgb,var(--st-ko) 70%,transparent)}
.edge.r{right:0;background:var(--st-known);box-shadow:0 0 18px 6px color-mix(in srgb,var(--st-known) 70%,transparent)}
.fcard:not(.flip) .fback,.fcard.flip .fface:not(.fback){pointer-events:none}
.fspk{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:var(--r-10);border:1px solid var(--line);background:var(--card);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;z-index:1;padding:0}
.fspk::before{content:'';position:absolute;inset:-8px}
.fspk svg{width:15px;height:15px}
.fback .fspk{background:color-mix(in srgb,var(--card) 60%,transparent)}
.fk{padding-right:36px}
.fin{display:grid;transition:transform .45s ease;transform-style:preserve-3d}
.fcard.flip .fin{transform:rotateY(180deg)}
.fface{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;min-height:280px;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r-16);padding:18px 16px;display:flex;flex-direction:column}
.fback{transform:rotateY(180deg);background:var(--accent-bg);border-color:var(--accent)}
.fk{font:700 12px system-ui,sans-serif;text-transform:uppercase;letter-spacing:.08em;color:var(--mute)}
.fback .fk{color:var(--accent-ink)}
.ft{font-family:Georgia,"Iowan Old Style",serif;font-size:var(--cfs,22px);line-height:1.5;margin-top:10px}
.fh{margin-top:auto;padding-top:14px;font:14px system-ui,sans-serif;color:var(--mute)}
:root[data-anim=off] .fin{transition:none}
.hintl{font-family:Georgia,"Iowan Old Style",serif;font-size:calc(var(--cfs,22px) - 2px);color:var(--accent-ink);margin-top:8px;letter-spacing:.02em}
.unote{display:flex;gap:8px;align-items:flex-start;margin-top:10px;padding:8px 10px;border:1px dashed color-mix(in srgb,var(--ink) 35%,transparent);border-radius:var(--r-10);background:var(--card);font:14px/1.4 system-ui,sans-serif;color:var(--mute)}
.bsec{border-top:1px solid var(--line)}
.bsh{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;padding:6px 2px;border:0;background:none;text-align:left;color:var(--ink);font-size:var(--fs-15)}
.bsh span{flex:1}.bsh b{font-weight:700}
.bsec.open .gch{transform:rotate(180deg)}
.bls{list-style:none;margin:0 0 8px;padding:0 0 0 4px;font-size:var(--fs-13);color:var(--mute)}
.bls li{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 10px;padding:5px 0;border-top:1px dashed var(--line)}
.bls li:first-child{border-top:0}
.bq{flex:1 1 60%;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bq b{color:var(--ink)}
.bt2{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}.bt2 .dot{width:9px;height:9px}
.miss li{margin:4px 0}

.ib{min-width:44px;min-height:44px;border-radius:var(--r-12);border:1px solid var(--line);background:var(--card);font-weight:700;font-size:var(--fs-15);padding:0 8px}
.whoc{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-14);padding:8px 6px 8px 14px;margin-bottom:10px}
.whoc .grow{flex:1;min-width:0;line-height:1.25}
.whoc b{font-size:var(--fs-18)}
.btn.sq{flex:0 0 54px;font-size:var(--fs-22);padding:0}
.btn.ko,.btn.ok{flex:1.4}
.cur.tap{cursor:pointer}
.mini.big{min-height:40px;padding:0 14px;font-size:var(--fs-14)}
.small{font-size:var(--fs-13)}
.mute.small{line-height:1.4}
.bar .ib{flex:0 0 auto}

.focus{display:flex;flex-direction:column;min-height:calc(100vh - 30px);min-height:calc(100dvh - 30px)}
.focus .actions{margin-top:auto}
.focus .cur{margin-bottom:20px}
.who2{flex-wrap:wrap}
.nb{margin-left:auto;height:24px;border-radius:var(--r-6);border:1px solid transparent;background:none;color:var(--mute);display:inline-flex;align-items:center;gap:3px;padding:0 6px;flex:none;font:400 11.5px system-ui,sans-serif;text-transform:none;letter-spacing:0;white-space:nowrap}
.nlb{display:inline-flex;align-items:center;gap:8px;min-height:38px;padding:0 14px;border-radius:var(--r-10);border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 14px system-ui,sans-serif}
.nlb svg{width:18px;height:18px}
.nb svg{width:12px;height:12px}
.nb .cv{width:10px;height:10px;margin-left:1px;transition:transform .15s}
.nb[aria-expanded=true] .cv{transform:rotate(180deg)}
.nb,.who2 .mini,.nbub .nact button{position:relative}
.nb::after,.who2 .mini::after{content:"";position:absolute;inset:-6px -4px}

/* ===== 2.03 ===== */
/* M36 : haut-parleur sur la ligne du compteur (Répétition et Cartes) — le compteur garde sa place, rien ne bouge */
.fpc{position:relative}
.pcr{display:flex;align-items:flex-start;gap:8px;position:relative;padding-right:44px;min-height:18px}
.ib.pspk{position:absolute;z-index:3;right:0;top:2px;width:36px;height:32px;min-width:36px;min-height:32px;padding:0;border-radius:var(--r-10);display:inline-flex;align-items:center;justify-content:center}
.ib.pspk svg{width:18px;height:18px}
.ib.pspk::after{content:"";position:absolute;inset:-6px -4px}
/* M30-3 : didascalies en police à empattements aussi pendant la répétition et dans les cartes */
.focus .dir,.focus .aside{font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif}
/* M39-A : la répétition en fil de bulles */
.thr{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:10px;padding:8px 0 6px}
.bub{max-width:86%;padding:8px 12px 10px;border-radius:var(--r-16);background:var(--card);border:1px solid var(--line);font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;font-size:var(--sfs,18px);line-height:1.45;position:relative}
.bub .who2{margin-bottom:3px;font-size:var(--fs-11)}
.bub.oth{align-self:flex-start;border-bottom-left-radius:6px}
.bub.mine{align-self:flex-end;background:var(--me-bg);border-color:var(--me-bd);border-bottom-right-radius:6px}
.bub.old{opacity:.55}
.bub.mine .num,.bub.todo .num{background:var(--accent);color:var(--on-accent)}
.bub.todo{align-self:flex-end;min-width:62%;background:transparent;border:2px dashed var(--me-bd);border-bottom-right-radius:6px;cursor:pointer}
.bub.todo .q{font:700 16px system-ui,sans-serif;color:var(--accent-ink)}
.bub.todo .s{font:12.5px/1.35 system-ui,sans-serif;color:var(--mute);margin-top:3px}
.bub .hintl{font-size:calc(var(--sfs,18px) - 1px);margin-top:4px}
.bub.oth.now{padding-right:48px}
.bub .unote{margin-top:8px}
.thr .dir{margin:0 10px;font-size:var(--fs-15)}
.actions.acol{flex-direction:column;gap:8px}
.arow{display:flex;gap:10px}
.arow .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;flex:1}
.endb{align-self:center;display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:0 14px;border-radius:var(--r-999);border:1.5px solid var(--accent);background:transparent;color:var(--accent-ink);font:700 12.5px system-ui,sans-serif;position:relative}
.endb::after{content:"";position:absolute;inset:-8px -6px}
/* M31-1 B : panneau « Affichage » de l'onglet Texte */
.segrow{display:flex;gap:8px;align-items:stretch}.segrow .seg{flex:1;min-width:0}
.ib.dpb{display:flex;align-items:center;justify-content:center;color:var(--ink);flex:none}
.ib.dpb.act{background:var(--accent-bg);border-color:var(--accent);color:var(--accent-ink)}
.dpan{display:flex;flex-direction:column;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-12);padding:6px 14px}
.dpan .sw{min-height:44px}
/* M37 : « Aucun personnage » */
.whoc b.nome{color:var(--mute);font-weight:500}
/* M38-1 B : une carte par réplique */
.script .line{background:var(--card);border:1px solid var(--line);border-radius:var(--r-12);padding:10px 12px;margin:8px 0}
.script .line.me{background:color-mix(in srgb,var(--accent) 10%,var(--card))}
.script.nohl .line.me{background:var(--card);border-color:var(--line)}
.script .line.ps{border-left-width:4px}
/* L6 (M46-2 E3, M47, M48-A) : suivi de lecture */
.script.follow .line,.script.follow .dir,.script.follow .cue{transition:opacity .2s,transform .2s,box-shadow .2s}
.script.follow .line:not(.trk),.script.follow .dir,.script.follow .cue{opacity:.45}
.script.follow .line.trk{transform:scale(1.025);box-shadow:0 8px 24px rgba(0,0,0,.18);position:relative;z-index:2}
.script.follow{padding-bottom:70vh}
.script.follow .line{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.nband{position:fixed;left:0;right:0;bottom:0;z-index:40;height:92px;border:0;display:flex;align-items:flex-end;justify-content:center;gap:6px;padding:0 0 calc(18px + env(safe-area-inset-bottom));background:linear-gradient(to bottom,transparent,color-mix(in srgb,var(--bg) 92%,transparent) 55%);color:var(--mute);font:600 14px system-ui,sans-serif;width:100%}
/* M30-1 : Réglages › Données */
.lrow{display:flex;align-items:center;justify-content:space-between;margin:18px 0 8px}
.mi{width:22px;height:22px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--mute);font:italic 600 12px Georgia,serif;display:inline-flex;align-items:center;justify-content:center;padding:0;position:relative;flex:none}
.mi::after{content:"";position:absolute;inset:-11px}
.dinf{margin:0 0 10px}.dinf p{margin:0 0 6px}.dinf p:last-child{margin:0}
.btn.dbt{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:8px;cursor:pointer}
.btn.dbt.dout{background:transparent;border-color:var(--accent);color:var(--accent-ink)}
.dfold{display:flex;align-items:center;justify-content:space-between;width:100%;background:none;border:0;padding:12px 0 6px;color:var(--ink);font:600 14px system-ui,sans-serif;min-height:44px}
.dfold .dch{color:var(--mute);transition:transform .15s}.dfold[aria-expanded=true] .dch{transform:rotate(180deg)}
.dit{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.dit b{flex:1;font-size:var(--fs-15)}
.dsq{width:44px;height:44px;border-radius:var(--r-12);border:1.5px solid var(--line);background:var(--card);display:inline-flex;align-items:center;justify-content:center;color:var(--ink);cursor:pointer;padding:0}
/* M30-2 : classement sans connexion */
.card.rkoff{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:20px 16px}
.rkoff svg{width:34px;height:34px;fill:none;stroke:var(--mute);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;margin-bottom:2px}
.rkoff b{font-size:var(--fs-15)}.rkoff span{font-size:var(--fs-13);color:var(--mute);line-height:1.4}
/* M37-2 : pastille « Choisir ⇅ » */
.chip.xs.nochip{background:transparent;border:1.5px dashed var(--line);color:var(--mute)}
/* M31-3 */
.hint .hnm{color:var(--ink);font-weight:600}
/* M31-5 (D3) : zones tactiles d'au moins 44 px */
.gsb{padding:11px 0}.gst{padding:9px 0}
.chip.xs{position:relative}.chip.xs::after{content:"";position:absolute;inset:-13px -4px}
.updlk{position:relative}.updlk::after{content:"";position:absolute;inset:-6px -2px}
.set input.rng{height:44px}
.set .lbl + .rng{margin-top:-27px}
.set .rng + .rngs{margin-top:-25px}
/* M32-3 option 3 (D8) : badges verrouillés, même contraste en clair et en sombre */
.rp:not([class*="t-"]){filter:brightness(2.4) saturate(.4) contrast(.75)}
:root[data-theme=dark] .rp:not([class*="t-"]){filter:brightness(1.6) saturate(.4) contrast(.75)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .rp:not([class*="t-"]){filter:brightness(1.6) saturate(.4) contrast(.75)}}

/* ===== 2.04 ===== */
/* 76 / 75 : écran de répétition et de cartes à la hauteur exacte de l'écran */
#app.fv{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
#app.fv>.focus{flex:1;min-height:0}
#app.fvx{height:100vh;height:100dvh;overflow:hidden}
#app.fv .admbar{position:static;flex:none}
#app.fvx .thr{min-height:0;overflow:hidden;-webkit-mask-image:linear-gradient(transparent,#000 24px);mask-image:linear-gradient(transparent,#000 24px)}
.thr .dir.old{opacity:.55}
.bub .stk{display:grid}.bub .stk>*{grid-area:1/1}
.bub.todo .rl{visibility:hidden}
.bub.todo .ov{display:flex;flex-direction:column;justify-content:center}
.bub.enter,.thr .dir.enter{animation:bubin .38s cubic-bezier(.2,.8,.2,1)}
@keyframes bubin{from{opacity:0;transform:translateY(34px)}to{opacity:1;transform:none}}
.bub.rvl .btxt{animation:bubfade .3s}
@keyframes bubfade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.bub.enter,.thr .dir.enter,.bub.rvl .btxt{animation:none}}
/* 77 : cartes — titre plus petit, recto plus discret ; carte un peu remontée ; « Terminer ici » */
.fk{font-size:var(--fs-11)}
.fface:not(.fback) .fk{color:var(--mute);opacity:.75;font-weight:600}
.focus .fwrap{padding-bottom:40px}
.arow .btn.sq{flex:0 0 54px}
.arow .btn{min-width:0;padding-left:8px;padding-right:8px}.arow .btn span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:340px){.focus .arow .btn{font-size:var(--fs-14)}.focus .arow .btn.sq{flex-basis:46px}.focus .arow .btn.hnx svg{display:none}}
.fwrap~.actions .arow .btn[data-act=hint]{flex:.82}.fwrap~.actions .arow .btn[data-act=reveal-step]{flex:1.18}
/* 78 (M51-C) : bande « Précédente | Suivante » */
.nband{align-items:stretch;gap:0;padding-left:0;padding-right:0}
.nband .nbh{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:6px;background:none;border:0;padding:0;color:inherit;font:inherit;min-height:0}
.nband .nbp{opacity:.8}
.nband .nup{display:inline-flex;transform:rotate(180deg)}
.nband .nsep{flex:none;width:1.5px;height:18px;align-self:flex-end;margin-bottom:1px;background:var(--line);border-radius:1px}
/* 80 (M52) : « ⋯ » dans le coin de la note */
.nbub.nb2{position:relative;padding-right:34px}
.nbub .nmore{position:absolute;top:2px;right:2px;width:36px;height:32px;border:0;background:none;padding:0;color:var(--mute);font:700 18px/1 system-ui,sans-serif;letter-spacing:1px;display:flex;align-items:center;justify-content:center}
.nbub .nmenu{position:absolute;right:6px;top:34px;z-index:5;min-width:160px;display:flex;flex-direction:column;padding:4px;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r-12);box-shadow:0 6px 18px rgba(0,0,0,.18)}
.nbub .nmenu button{display:flex;align-items:center;gap:8px;min-height:42px;padding:0 12px;border:0;background:none;border-radius:var(--r-8);font:600 14px system-ui,sans-serif;color:var(--ink);text-align:left}
.nbub .nmenu button.dg{color:color-mix(in srgb,var(--st-ko) 70%,var(--ink))}

/* ===== 2.03 · essai 3 ===== */
#app.fv{padding-bottom:calc(10px + env(safe-area-inset-bottom))}
.thr .tnw{animation:bubfade .42s}
/* M61-G1 : haut-parleur | drapeau dans une seule pastille, coin haut droit */
.pcr.pcr2{padding-right:80px}
.pgrp{position:absolute;z-index:3;right:0;top:2px;display:inline-flex;border:1.5px solid var(--line);border-radius:var(--r-10);background:var(--card);overflow:hidden}
.pgrp .ib,.pgrp .ib.pspk{position:relative;top:auto;right:auto;width:36px;height:29px;min-width:36px;min-height:29px;padding:0;border:0;border-radius:0;background:none;box-shadow:none;display:inline-flex;align-items:center;justify-content:center}
.pgrp .ib::after{inset:-6px 0}
.pgrp .pfl{border-left:1.5px solid var(--line);color:var(--accent-ink)}
.pgrp .pfl svg{width:16px;height:16px}
/* M64-3 : « ⋮ » sans pastille en haut à droite, menu sous le doigt */
.nbub > div:first-child{padding-top:0}
.nbub.nb2{padding-right:30px}
.nbub .nmore{top:6px;right:4px;width:24px;height:26px;opacity:.7}
.nbub .nmenu{top:30px;right:4px;min-width:150px;padding:4px;border-width:1px;box-shadow:0 8px 22px rgba(0,0,0,.16)}
.nbub .nmenu button{min-height:40px;font-size:var(--fs-14);gap:10px}
/* M56 : tableau des paliers (admin) */
.fwrap~.actions .arow .btn.hnx{flex:1}   /* « Indice suivant » : même largeur que « Retourner » pour ne pas être coupé */
.bgtab{margin:0 0 10px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r-12);background:var(--card)}
.bgtab table{border-collapse:collapse;width:100%;font-size:var(--fs-12)}
.bgtab th{font-weight:600;font-size:var(--fs-11);color:var(--mute);text-align:center;padding:2px 3px}
.bgtab td{text-align:center;padding:3px;white-space:nowrap}
.bgtab td:first-child{text-align:left;font-weight:600;padding-left:0}

/* ===== 2.03 · essai 4 ===== */
/* M65-A : [notes | haut-parleur] + [drapeau] ; icônes à la même teinte, grisées quand coupées */
.pcr.pcr3{padding-right:82px}
.pcr.pcr3.pcrf{padding-right:126px}
.pwrap{position:absolute;z-index:3;right:0;top:2px;display:flex;gap:6px}
.pwrap .pgrp{position:static}
.pgrp .pspk{border-left:1.5px solid var(--line)}
.pgrp .pnt,.pgrp .pspk{color:var(--ink)}
.pgrp .pnt.off,.pgrp .pspk.off,.pgrp .pspk[data-act=nosound]{color:var(--mute);opacity:.75}
.pgrp .pnt{position:relative}
.pgrp .pnt.off::before{content:"";position:absolute;left:10px;right:10px;top:50%;height:1.8px;background:currentColor;transform:rotate(-45deg);border-radius:2px}
.pgrp .pnt svg{width:16px;height:16px;margin:0!important}
.pgrp .pfl{border-left:0}
/* 122 : mêmes largeurs qu'en Cartes */
.focus .arow .btn[data-act=hint]{flex:.82}.focus .arow .btn.pri[data-act=reveal-step]{flex:1.18}.focus .arow .btn.hnx,.focus .arow:has(.hnx) .btn.pri{flex:1}
/* admin : test du sélecteur */
.fpt{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0;font-size:var(--fs-13)}
.fpt input[type=file]:not([hidden]){max-width:170px;font-size:var(--fs-12)}

/* ===== 2.03 · essai 5 ===== */
/* 135 (M66-1) : pastille du drapeau carrée, drapeau recentré */
.pgrp .pfl{width:29px;min-width:29px}
.pgrp .pfl svg{transform:translateX(1px)}
/* 136 (M66-3 A) : contour de « Recommencer » */
.row2 .btn.soft.rcm{border:1.5px solid var(--accent)}
/* 141 (M67-2) : décompte des indices, taille fixe */
.focus .arow .btn.hbt{flex:.82}
.focus .arow .btn.hbt:disabled{opacity:.45}
.arow .btn .hcnt{flex:none;width:18px;height:18px;border-radius:50%;border:1.2px solid var(--line);color:var(--mute);font:700 10.5px/1 system-ui,sans-serif;font-style:normal;display:inline-flex;align-items:center;justify-content:center;padding:0;margin-left:1px;box-sizing:border-box}
/* 145 : champ invisible posé sur le bouton (test) */
.fpov{position:relative;display:inline-flex}
.fpov input[type=file]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}

/* ===== 2.03 · essai 6 ===== */
/* 155 : le doigt touche directement le champ du téléphone, posé invisible sur le bouton (ouverture plus rapide) */
.fpv{position:relative;overflow:hidden;cursor:pointer}
.fpv .fpvi{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0;margin:0;padding:0;border:0}

/* ===== 2.04 ===== */
/* 171 (M68 / M71 B) */
.nbtns .btn.soft.svb{border:1.5px solid var(--accent)}
.btn.del{flex:0 0 auto;background:none;border:0;color:color-mix(in srgb,var(--st-ko) 75%,var(--ink));display:inline-flex;align-items:center;gap:6px;padding:0 6px;font-weight:600}
/* minuteur : icône */
.hd-r{display:flex;align-items:center;gap:8px}
.ib.tm-ic{position:relative;display:inline-flex;align-items:center;justify-content:center}
.tm-ic .tm-dot{display:none;position:absolute;top:7px;right:7px;width:9px;height:9px;border-radius:50%;background:var(--accent);border:2px solid var(--card)}
.tm-ic.tma .tm-dot{display:block}
/* barre « entre-deux » (Minuteur-M32 B), collée en haut */
.tm-slot{position:sticky;top:0;z-index:20;margin:0 -14px;padding:0 14px;background:var(--bg)}
.tm-slot:empty,.tm-slot:has(> .tm-bar[hidden]){display:none}
.tm-bar{padding:4px 0 6px;cursor:pointer;-webkit-user-select:none;user-select:none}
.tm-bar[hidden]{display:none}
.tm-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;min-height:28px}
.tm-rd{font:700 10.5px/1.2 system-ui,sans-serif;letter-spacing:.03em;color:var(--mute);white-space:nowrap}
.tm-tt{font:700 15px/1 system-ui,sans-serif;font-variant-numeric:tabular-nums}
.tm-pb{justify-self:end;width:48px;height:44px;margin:-8px -8px -8px 0;border:0;background:none;padding:0;display:grid;place-items:center;color:var(--ink)}
.tm-pbi{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center}
.tm-pg{height:3px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:2px}
.tm-pg i{display:block;height:100%;background:var(--ink);border-radius:3px;transition:width .25s linear}
.tm-bar.end .tm-tt,.tm-bar.end .tm-rd{color:var(--st-ko)}.tm-bar.end .tm-pg i{background:var(--st-ko)}
.tm-bar.wait .tm-pg i{background:var(--mute)}
/* grand minuteur plein écran (Minuteur-M30, M31) */
.tm-sh{position:fixed;inset:0;z-index:70;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);transition:transform .25s ease}
.tm-sh[hidden]{display:none}
.tm-hd{display:flex;align-items:center;gap:8px;padding:14px 12px 4px 18px}
.tm-hd h2{flex:1;margin:0;font-size:var(--fs-18)}
.tm-sb{flex:1;overflow-y:auto;padding:4px 18px 12px;touch-action:pan-y}
.tm-stp{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-12);padding:5px 5px 5px 14px;min-height:54px;margin-bottom:8px}
.tm-stp .tm-n{flex:1;font-weight:600}
.tm-stp .tm-v{font:700 16px system-ui,sans-serif;font-variant-numeric:tabular-nums;min-width:76px;text-align:center}
.tm-stp button{width:44px;height:44px;border-radius:11px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:700 22px/1 system-ui,sans-serif;padding:0}
.tm-sw{background:var(--card);border:1px solid var(--line);border-radius:var(--r-12);padding:6px 14px;min-height:50px;margin-bottom:8px;font-weight:600}
.tm-test{width:100%;min-height:48px;margin-top:4px}
.tm-ft{padding:10px 18px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--bg);display:grid;grid-template-columns:1fr;gap:8px}
.tm-ft.tm-g2{grid-template-columns:1fr 1fr}
.tm-ft .btn{display:flex;align-items:center;justify-content:center;gap:8px}
.tm-ft .btn svg{flex:none}
.tm-full{grid-column:1/-1}
.tm-rsb{display:flex;flex-direction:column;justify-content:center;padding-bottom:28px}
.tm-ring{position:relative;width:min(86%,290px);aspect-ratio:1;margin:0 auto}
.tm-ring > svg{width:100%;height:100%;transform:rotate(-90deg)}
.tm-ring circle{fill:none;stroke-width:6.5;stroke-linecap:butt}
.tm-ring .tm-bg{stroke:var(--line)}
.tm-ring .tm-fg{stroke:var(--ink);transition:stroke-dashoffset .25s linear,stroke .3s}
.tm-ring.end .tm-fg{stroke:var(--st-ko)}.tm-ring.wait .tm-fg{stroke:var(--mute)}
.tm-rc{position:absolute;inset:13%;border:0;border-radius:50%;background:none;color:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0}
.tm-rc:active{background:color-mix(in srgb,var(--ink) 6%,transparent)}
.tm-big{font:700 60px/1 system-ui,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.tm-ring.paused .tm-big{opacity:.45}
.tm-ring.end .tm-big{color:var(--st-ko)}
.tm-cap{font-size:12.5px;color:var(--mute);font-weight:700;margin-top:4px;text-transform:uppercase;letter-spacing:.06em;min-height:15px}
.tm-pi{margin-top:6px;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;color:var(--mute)}
.tm-seg{display:flex;gap:6px;max-width:240px;width:100%;margin:22px auto 0}
.tm-seg i{flex:1;height:5px;border-radius:6px;background:var(--line);position:relative;overflow:hidden}
.tm-seg b{position:absolute;inset:0;width:0;background:var(--mute);opacity:.6}
.tm-stop{position:relative;overflow:hidden;min-height:58px;background:var(--st-ko);border-color:var(--st-ko);color:#fff;font-size:17px;box-shadow:0 2px 0 rgba(0,0,0,.18);transition:background .15s}
.tm-stop.arm{background:color-mix(in srgb,var(--st-ko) 55%,#000);border-color:transparent}
.tm-stop .tm-sq{width:15px;height:15px;background:#fff;border-radius:3px;display:block}
.tm-stop .tm-cdb{position:absolute;left:0;bottom:0;height:5px;background:#fff;opacity:.85}
/* alerte « halo doux » (Minuteur-M33) */
.tm-al{position:fixed;inset:0;z-index:350;display:flex;align-items:center;justify-content:center;padding:22px;background:rgba(20,16,12,.5);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.tm-al[hidden]{display:none}
.tm-al::before{content:"";position:absolute;inset:0;pointer-events:none}
.tm-al.fl::before{animation:tmglow 1.2s ease-in-out infinite}
@keyframes tmglow{0%,100%{box-shadow:inset 0 0 18px 4px color-mix(in srgb,var(--st-ko) 35%,transparent)}50%{box-shadow:inset 0 0 70px 26px color-mix(in srgb,var(--st-ko) 95%,transparent)}}
.tm-cd{position:relative;z-index:1;background:var(--card);color:var(--ink);border-radius:22px;padding:22px 18px 16px;width:100%;max-width:360px;box-shadow:0 10px 40px rgba(0,0,0,.35);display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.tm-bell{width:60px;height:60px;border-radius:50%;background:var(--bg);display:grid;place-items:center;color:var(--st-ko);animation:tmshake .5s infinite}
@keyframes tmshake{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
.tm-cd h3{margin:2px 0 0;font-size:22px}.tm-cd p{margin:0 0 8px;color:var(--mute);font-size:15px}
.tm-abt{display:flex;flex-direction:column;gap:8px;width:100%}
.tm-abt .btn{width:100%;white-space:normal;line-height:1.25;padding:8px 14px}
/* préavis : halo jaune qui pulse 2 fois */
.tm-pre{position:fixed;inset:0;z-index:349;pointer-events:none;opacity:0;box-shadow:inset 0 0 70px 26px rgba(245,190,0,.95)}
.tm-pre.go{animation:tmpre 1.8s ease-out}
@keyframes tmpre{0%{opacity:0}15%{opacity:1}40%{opacity:.3}60%{opacity:1}100%{opacity:0}}
/* message « Minuteur arrêté », en haut */
.tm-toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top));transform:translate(-50%,-16px);opacity:0;transition:.25s;z-index:9998;display:flex;align-items:center;gap:8px;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font:600 14.5px system-ui,sans-serif;white-space:nowrap;pointer-events:none}
.tm-toast.on{opacity:1;transform:translate(-50%,0)}

/* ===== 2.04 · essai 2 ===== */
/* 175 / 181 : grand minuteur ouvert → la page derrière ne défile plus, pas de rechargement en glissant */
html.tmlock,html.tmlock body{overflow:hidden;overscroll-behavior:none}
.tm-sh,.tm-sb{overscroll-behavior:contain}
.tm-hd,.tm-ring,.tm-sb.tm-rsb,.tm-ft{touch-action:none}
/* 178 (M79 H1) : cadran et cercle à la couleur du thème, espace entre les deux ; chiffres et bouton nets */
.tm-ring .tm-fg{stroke:var(--accent)}
.tm-rc{inset:10%;background:color-mix(in srgb,var(--accent) 12%,var(--card))}
.tm-rc:active{background:color-mix(in srgb,var(--accent) 20%,var(--card))}
.tm-pi{background:var(--card);color:var(--ink);border-color:var(--line)}
/* 182 (M72 A) : flèche de retour plus proche du titre */
.bar{gap:4px}
.bar .ghost.back{min-width:34px;margin-left:-4px;padding-right:0}
/* 184 (M74 A) : bouton pause de la barre en carré arrondi */
.tm-pbi{border-radius:8px;width:30px;height:28px}
/* 188 (M75) : halo vert, une seule pulsation, quand le minuteur repart après une pause */
.tm-go{box-shadow:inset 0 0 70px 26px rgba(60,190,110,.9)}
.tm-go.go{animation:tmgo 1s ease-out}
@keyframes tmgo{0%{opacity:0}25%{opacity:1}100%{opacity:0}}
/* animations réduites : les halos jaune et vert restent affichés, fixes, pendant 1 s */
@keyframes tmfix{0%{opacity:1}100%{opacity:0}}

/* ===== 2.04 · essai 3 ===== */
/* 206 (M84) : fond du cadran 30 % en clair, 12 % en sombre ; appui +8 % (A) ; 205 (M80-2 B) : suit la couleur du cercle au préavis */
:root{--tmdp:30%;--tmdq:38%}
:root[data-theme=dark]{--tmdp:12%;--tmdq:20%}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--tmdp:12%;--tmdq:20%}}
.tm-rc{background:color-mix(in srgb,var(--tmdc,var(--accent)) var(--tmdp),var(--card))}
.tm-rc:active{background:color-mix(in srgb,var(--tmdc,var(--accent)) var(--tmdq),var(--card))}
/* 202 (M81-2) : barres de passages : terminés = thème affaibli, en cours = thème plein (ne suivent pas le préavis) */
.tm-seg b{background:var(--accent);opacity:1}
.tm-seg b.dn{background:color-mix(in srgb,var(--accent) 45%,var(--bg))}
/* 210 (M81-4) : halos réduits de moitié (jaune, vert, alerte de fin) */
.tm-pre{box-shadow:inset 0 0 35px 13px rgba(245,190,0,.95)}
.tm-go{box-shadow:inset 0 0 35px 13px rgba(60,190,110,.9)}
/* 209 (M80-5 C) : « Suivant » pendant un passage : pulsation à la couleur du thème */
.tm-go.th{box-shadow:inset 0 0 35px 13px color-mix(in srgb,var(--accent) 90%,transparent)}
@keyframes tmglow{0%,100%{box-shadow:inset 0 0 9px 2px color-mix(in srgb,var(--st-ko) 35%,transparent)}50%{box-shadow:inset 0 0 35px 13px color-mix(in srgb,var(--st-ko) 95%,transparent)}}
/* 224 (essai 4) : le minuteur suit le réglage de l'appli Réglages › Animations (Réduites ou Désactivées → halos fixes, pas de mouvement) ;
   sans choix, ce réglage suit déjà le téléphone. Attribut data-tmrm posé par tmPaint. */
:root[data-tmrm] .tm-pre.go,:root[data-tmrm] .tm-go.go{animation:tmfix 1s steps(1,end)}
:root[data-tmrm] .tm-al.fl::before{animation:none;box-shadow:inset 0 0 var(--tmhb) var(--tmhs) color-mix(in srgb,var(--st-ko) var(--tmhq),transparent)}
:root[data-tmrm] .tm-bell{animation:none}
/* 2.04 · essai 6 (M85 C) : halos plus denses en clair (40px 18px, couleur pleine) ; le sombre garde la taille de l'essai 3 (35px 13px).
   Alerte de fin : même taille maximale que les autres halos, pulsation qui repart moins petit ; en animations réduites, fixe à la taille des autres. */
:root{--tmhb:40px;--tmhs:18px;--tmhp:100%;--tmhq:100%;--tmgb:14px;--tmgs:5px;--tmgp:60%}
:root[data-theme=dark]{--tmhb:35px;--tmhs:13px;--tmhp:90%;--tmhq:95%;--tmgb:9px;--tmgs:2px;--tmgp:35%}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--tmhb:35px;--tmhs:13px;--tmhp:90%;--tmhq:95%;--tmgb:9px;--tmgs:2px;--tmgp:35%}}
.tm-pre{box-shadow:inset 0 0 var(--tmhb) var(--tmhs) color-mix(in srgb,#F5BE00 var(--tmhq),transparent)}
.tm-go{box-shadow:inset 0 0 var(--tmhb) var(--tmhs) color-mix(in srgb,#3CBE6E var(--tmhp),transparent)}
.tm-go.th{box-shadow:inset 0 0 var(--tmhb) var(--tmhs) color-mix(in srgb,var(--accent) var(--tmhp),transparent)}
.tm-al.fl::before{animation:tmglow2 1.2s ease-in-out infinite}
@keyframes tmglow2{0%,100%{box-shadow:inset 0 0 var(--tmgb) var(--tmgs) color-mix(in srgb,var(--st-ko) var(--tmgp),transparent)}50%{box-shadow:inset 0 0 var(--tmhb) var(--tmhs) color-mix(in srgb,var(--st-ko) var(--tmhq),transparent)}}
/* 210 (M81-5) : ligne de détection dans admin › Minuteur */
.tm-rmr{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;font-size:var(--fs-14)}
.tm-rmd{flex:none;width:auto;min-width:0;font:700 12.5px system-ui,sans-serif;padding:4px 10px;border-radius:999px;background:var(--line);color:var(--ink)}
.tm-rmd.on{background:#22A06B;color:#fff}
</style>
</head>

<script>
/*
 * Répète — sons des animations de récompense
 * ------------------------------------------------------------
 * 100 % synthétisé avec l'API Web Audio : aucun fichier audio, aucune librairie.
 *
 * Utilisation (au moment où tu ajoutes la classe `go`) :
 *   RepeteSons.ovation();            // fin de répétition
 *   RepeteSons.laurier(3);           // nouveau titre : 0 Figurant … 4 Tête d'affiche
 *   RepeteSons.badge('or');          // bronze | argent | or | platine | diamant | unique
 *
 * Réglages :
 *   RepeteSons.setEnabled(true|false);   // option « Sons des récompenses »
 *   RepeteSons.setVolume(0..1);          // 0.5 par défaut
 *   RepeteSons.stop();                   // coupe le son en cours (fondu de 0,12 s)
 *   RepeteSons.unlock();                 // à appeler dans un geste utilisateur (iOS/Safari)
 *
 * Silence automatique si prefers-reduced-motion: reduce.
 * Le décalage de chaque son est calé sur la chronologie CSS des animations.
 */
(function (g) {
  'use strict';

  var ctx = null, master = null, verbIn = null, noiseBuf = null, verbBuf = null, bus = null, cur = null;
  var volume = 0.4, enabled = true;

  /* ---------- moteur ---------- */
  function reduced() {
    return g.matchMedia && g.matchMedia('(prefers-reduced-motion: reduce)').matches;
  }

  function impulse(sec, decay) {
    var sr = ctx.sampleRate, n = Math.floor(sr * sec), b = ctx.createBuffer(2, n, sr);
    for (var c = 0; c < 2; c++) {
      var d = b.getChannelData(c);
      for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, decay);
    }
    return b;
  }

  function init() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return ctx; }
    var AC = g.AudioContext || g.webkitAudioContext;
    if (!AC) return null;
    ctx = new AC();
    master = ctx.createGain();
    master.gain.value = volume;
    var comp = ctx.createDynamicsCompressor();
    master.connect(comp); comp.connect(ctx.destination);
    verbBuf = impulse(1.9, 2.6);
    var n = ctx.sampleRate * 2;
    noiseBuf = ctx.createBuffer(1, n, ctx.sampleRate);
    var d = noiseBuf.getChannelData(0);
    for (var i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    return ctx;
  }

  function send(node, wet) {
    node.connect(bus || master);
    if (wet > 0 && verbIn) {
      var s = ctx.createGain(); s.gain.value = wet;
      node.connect(s); s.connect(verbIn);
    }
  }

  /* oscillateur avec enveloppe : o = {a, sustain, to, glide, detune, lp:[f0,f1], wet} */
  function tone(f, t, d, type, v, o) {
    o = o || {};
    var osc = ctx.createOscillator(), gn = ctx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(f, t);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + (o.glide || d));
    if (o.detune) osc.detune.value = o.detune;
    var a = o.a || 0.005;
    gn.gain.setValueAtTime(0.0001, t);
    gn.gain.linearRampToValueAtTime(v, t + a);
    if (o.sustain) gn.gain.setValueAtTime(v, t + o.sustain);
    gn.gain.exponentialRampToValueAtTime(0.0001, t + d);
    if (o.lp) {
      var fl = ctx.createBiquadFilter();
      fl.type = 'lowpass';
      fl.frequency.setValueAtTime(o.lp[0], t);
      fl.frequency.linearRampToValueAtTime(o.lp[1], t + d * 0.6);
      osc.connect(fl); fl.connect(gn);
    } else osc.connect(gn);
    send(gn, o.wet || 0);
    osc.start(t); osc.stop(t + d + 0.05);
  }

  /* bruit filtré : le filtre glisse de f0 à f1 */
  function noise(t, d, type, f0, f1, v, q, wet) {
    var src = ctx.createBufferSource(), fl = ctx.createBiquadFilter(), gn = ctx.createGain();
    src.buffer = noiseBuf; src.loop = true;
    fl.type = type; fl.Q.value = q || 0.7;
    fl.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) fl.frequency.exponentialRampToValueAtTime(f1, t + d);
    gn.gain.setValueAtTime(0.0001, t);
    gn.gain.linearRampToValueAtTime(v, t + Math.min(0.01, d / 3));
    gn.gain.exponentialRampToValueAtTime(0.0001, t + d);
    src.connect(fl); fl.connect(gn); send(gn, wet || 0);
    src.start(t, Math.random()); src.stop(t + d + 0.05);
  }

  /* cloche : partiels inharmoniques */
  var BELL = [[1, 1, 1], [2.76, 0.5, 0.6], [5.4, 0.25, 0.35], [8.93, 0.12, 0.2]];
  function bell(f, t, v, d, wet) {
    for (var i = 0; i < BELL.length; i++)
      tone(f * BELL[i][0], t, d * BELL[i][2], 'sine', v * BELL[i][1], { a: 0.003, wet: wet });
  }

  /* bol chantant : plus pur, avec un battement */
  var BOWL = [[1, 1, 1], [2.71, 0.4, 0.6], [5.15, 0.15, 0.4]];
  function bowl(f, t, v, d, wet) {
    for (var i = 0; i < BOWL.length; i++) {
      tone(f * BOWL[i][0], t, d * BOWL[i][2], 'sine', v * BOWL[i][1], { a: 0.01, wet: wet });
      if (i === 0) tone(f * 1.004, t, d, 'sine', v * 0.6, { a: 0.01, wet: wet });
    }
  }

  function go(fn) {
    if (!enabled || reduced()) return;
    if (!init()) return;
    stop();
    newBus();
    fn(ctx.currentTime + 0.06);
  }

  /* chaque son a son propre circuit (bus + réverbération) : on peut le couper net sans toucher au suivant */
  function newBus() {
    bus = ctx.createGain(); bus.connect(master);
    var vi = ctx.createGain(); vi.gain.value = 0.4;
    var v = ctx.createConvolver(); v.buffer = verbBuf;
    vi.connect(v); v.connect(bus);
    verbIn = vi; cur = bus;
  }
  function stop() {
    if (!ctx || !cur) return;
    var t = ctx.currentTime, b = cur; cur = null;
    try {
      b.gain.cancelScheduledValues(t);
      b.gain.setValueAtTime(b.gain.value, t);
      b.gain.linearRampToValueAtTime(0, t + 0.12);
      setTimeout(function () { try { b.disconnect(); } catch (e) {} }, 400);
    } catch (e) {}
  }

  /* ---------- 1 · Ovation — « Scène terminée » : rideau, projecteur, cordes ---------- */
  function ovation() {
    go(function (t) {
      // 0,05 s : le projecteur s'allume — « poum » de scène, sans bourdonnement
      tone(80, t + 0.05, 0.22, 'sine', 0.24, { to: 52, wet: 0.2 });
      noise(t + 0.05, 0.05, 'lowpass', 900, 400, 0.08);

      // 0,1 → 0,9 s : le rideau de velours s'ouvre — froissement doux qui monte puis retombe
      var src = ctx.createBufferSource(), bp = ctx.createBiquadFilter(), lp = ctx.createBiquadFilter(), gn = ctx.createGain();
      src.buffer = noiseBuf; src.loop = true;
      bp.type = 'bandpass'; bp.Q.value = 0.9;
      bp.frequency.setValueAtTime(180, t + 0.1);
      bp.frequency.exponentialRampToValueAtTime(950, t + 0.9);
      lp.type = 'lowpass'; lp.frequency.value = 1800;
      gn.gain.setValueAtTime(0.0001, t + 0.1);
      gn.gain.linearRampToValueAtTime(0.16, t + 0.5);
      gn.gain.linearRampToValueAtTime(0.0001, t + 1.0);
      src.connect(bp); bp.connect(lp); lp.connect(gn); send(gn, 0.35);
      src.start(t + 0.1, Math.random()); src.stop(t + 1.05);

      // 0,3 → 2,3 s : accord de cordes MONTANT — les notes entrent de bas en haut (ré majeur ajouté d'une neuvième),
      // chacune glisse légèrement vers sa hauteur, et l'accord s'ouvre (filtre) en montant
      [146.8, 220, 293.7, 370, 440, 587.3, 740, 880].forEach(function (f, i) {
        var st = t + 0.3 + i * 0.13;
        [-7, 0, 7].forEach(function (dt) {
          tone(f * 0.94, st, 2.1 - i * 0.13, 'sawtooth', 0.014,
            { a: 0.22, sustain: 1.1, to: f, glide: 0.3, detune: dt, lp: [450 + i * 80, 1500 + i * 250], wet: 0.55 });
        });
      });

      // 1,3 s : la note la plus haute, douce, au sommet de la montée
      tone(1174.7, t + 1.3, 1.6, 'triangle', 0.07, { a: 0.006, wet: 0.65 });
      tone(2349, t + 1.3, 0.5, 'sine', 0.012, { a: 0.004, wet: 0.65 });
    });
  }

  /* ---------- 2 · Laurier — nouveau titre ---------- */
  var ROOTS = [196, 220, 246.9, 261.6, 293.7];   // Figurant … Tête d'affiche
  var HARP = [1, 9 / 8, 5 / 4, 3 / 2, 5 / 3, 2, 9 / 4, 5 / 2, 3];
  var PENTA = [1, 9 / 8, 5 / 4, 3 / 2, 5 / 3];

  function laurier(titleIdx) {
    var root = ROOTS[Math.max(0, Math.min(4, titleIdx | 0))];
    go(function (t) {
      // 0,05 → 0,95 s : la tige se dessine — glissando de harpe
      HARP.forEach(function (r, i) {
        var f = root * 2 * r, ti = t + 0.05 + i * 0.1;
        tone(f, ti, 1.3, 'triangle', 0.15, { a: 0.004, wet: 0.5 });
        tone(f * 2, ti, 0.5, 'sine', 0.04, { a: 0.003, wet: 0.5 });
      });
      // 0,1 → 0,75 s : les feuilles apparaissent — petits tics de clochette
      for (var i = 0; i < 12; i++) {
        var f = root * 4 * PENTA[i % 5] * (i >= 5 ? 2 : 1);
        tone(f, t + 0.1 + i * 0.057, 0.22, 'sine', 0.035, { a: 0.002, wet: 0.3 });
      }
      // 0,7 s : le nœud se pose — timbale et cymbale frappée
      tone(120, t + 0.7, 0.55, 'sine', 0.42, { to: 62, glide: 0.3 });
      noise(t + 0.7, 0.14, 'lowpass', 500, 200, 0.22);
      noise(t + 0.7, 1.0, 'highpass', 6500, 6500, 0.05, 0.7, 0.6);

      // 0,85 s : le titre — accord de cuivres tenu
      [1, 5 / 4, 3 / 2, 2].forEach(function (r) {
        [-6, 6].forEach(function (dt) {
          tone(root * 2 * r, t + 0.85, 1.6, 'sawtooth', 0.03,
            { a: 0.14, sustain: 0.9, detune: dt, lp: [700, 2300], wet: 0.4 });
        });
      });
      // étincelles
      bell(root * 8, t + 0.95, 0.04, 0.6, 0.4);
      bell(root * 10, t + 1.05, 0.035, 0.6, 0.4);
      // 1,35 s : « Niveau »
      bell(root * 4, t + 1.35, 0.2, 2.3, 0.6);
    });
  }

  /* ---------- 3 · Badge — rotation 3D ---------- */
  var BASE = { bronze: 220, argent: 293.7, or: 329.6, platine: 392, diamant: 523.3, unique: 261.6 };

  function badge(tier) {
    var base = BASE[tier] || BASE.or, uni = tier === 'unique';
    go(function (t) {
      // 0 s : entrée de la médaille
      tone(300, t, 0.1, 'sine', 0.3, { to: 120 });

      // 0,1 → 1,5 s : rotation — souffle qui accélère puis ralentit
      var src = ctx.createBufferSource(), fl = ctx.createBiquadFilter(), gn = ctx.createGain();
      src.buffer = noiseBuf; src.loop = true;
      fl.type = 'bandpass'; fl.Q.value = 1.4;
      fl.frequency.setValueAtTime(300, t + 0.1);
      fl.frequency.exponentialRampToValueAtTime(3000, t + 0.54);
      fl.frequency.exponentialRampToValueAtTime(500, t + 1.5);
      gn.gain.setValueAtTime(0.0001, t + 0.1);
      gn.gain.linearRampToValueAtTime(0.2, t + 0.54);
      gn.gain.linearRampToValueAtTime(0.0001, t + 1.5);
      src.connect(fl); fl.connect(gn); send(gn, 0.2);
      src.start(t + 0.1, Math.random()); src.stop(t + 1.55);

      // 0,54 s : médaille de chant — « tchink », la couleur change
      bell(base * 6, t + 0.54, 0.14, 0.4, 0.3);
      noise(t + 0.54, 0.03, 'highpass', 5000, 5000, 0.1);

      // 1,05 s : le motif se grave
      noise(t + 1.05, 0.03, 'highpass', 3000, 3000, 0.16);
      tone(1200, t + 1.05, 0.06, 'triangle', 0.1, { to: 700 });

      // 1,5 s : reflet — « shing »
      noise(t + 1.5, 0.28, 'highpass', 3000, 9000, 0.1, 0.9, 0.3);

      // 1,55 et 1,74 s : les deux ondes — bols chantants
      bowl(base * 2, t + 1.55, 0.2, 2.2, 0.6);
      bowl(base, t + 1.74, 0.17, 2.4, 0.6);

      // 1,55 → 1,72 s : scintillements — célesta
      var P = [1, 9 / 8, 5 / 4, 3 / 2, 5 / 3, 2, 9 / 4, 5 / 2];
      for (var i = 0; i < 8; i++) {
        var f = base * 4 * P[i];
        tone(f, t + 1.55 + i * 0.024, 0.6, 'sine', 0.045, { a: 0.002, wet: 0.5 });
        tone(f * 2, t + 1.55 + i * 0.024, 0.25, 'sine', 0.015, { a: 0.002, wet: 0.5 });
      }

      // 1,65 s : texte — accord final (nappe mystérieuse pour les badges uniques)
      var chord = uni ? [1, 1.2, 1.5, 1.8, 2.4] : [1, 1.25, 1.5, 2];
      chord.forEach(function (r) {
        tone(base * r, t + 1.65, uni ? 2.2 : 1.5, uni ? 'triangle' : 'sine', uni ? 0.05 : 0.06,
          { a: uni ? 0.2 : 0.05, wet: 0.5, lp: uni ? [500, 1800] : null });
        tone(base * r * 2, t + 1.65, 1.2, 'sine', 0.015, { a: 0.05, wet: 0.5 });
      });
    });
  }

  g.RepeteSons = {
    ovation: ovation,
    laurier: laurier,
    badge: badge,
    unlock: init,
    setEnabled: function (b) { enabled = !!b; },
    isEnabled: function () { return enabled; },
    stop: stop,
    setVolume: function (v) { volume = Math.max(0, Math.min(1, v)); if (master) master.gain.value = volume; }
  };
})(window);

</script>

   abréviations avec un point (M. DUPONT), jusqu'à 5 mots. Les anciennes formes restent reconnues. */
const NM_ABBR = ['M', 'MM', 'MME', 'MMES', 'MLLE', 'MLLES', 'MR', 'MRS', 'MS', 'DR', 'PR', 'ME', 'MGR', 'ST', 'STE', 'SR'];
const nmBuild = (L, ab) => { const w = '[' + L + '](?:[' + L + "'’]|-(?=[" + L + ']))*';   /* mot : lettres, apostrophes, trait d'union collé entre deux lettres */
  const t = '(?:(?:' + ab.join('|') + ')\\.\\s?)?' + w;   /* « M. » devant un mot */
  return t + '(?: +(?:' + t + '|\\d{1,3}))*'; };   /* mots suivants : aussi un nombre (jamais en premier) ; le nombre de mots est vérifié ensuite */
const NM_ANY = nmBuild('A-ZÀ-ÖØ-Þa-zà-öø-ÿ', NM_ABBR.concat(NM_ABBR.map(a => a.charAt(0) + a.slice(1).toLowerCase())));
const NM_UP = nmBuild('A-ZÀ-ÖØ-Þ', NM_ABBR);
const RE_DASH = new RegExp('^(' + NM_ANY + ')\\s*(?:\\(([^)]*)\\)|,\\s*([^—–:.]{1,60}?))?(\\s*[.:]\\s*[—–-]|\\s+[—–]|\\s+-(?=\\s))\\s*(.*)$');
const RE_UP2 = new RegExp('^(' + NM_UP + ')\\s*(?:\\(([^)]*)\\))?\\s*[.:]\\s*(.*)$');
const RE_UPONLY2 = new RegExp('^(' + NM_UP + ')\\s*$');
const RE_UP = /^([A-ZÀ-Þ][A-ZÀ-Þ'’ ]{1,38}?)\s*(?:\(([^)]*)\))?\s*[.:]\s*(.*)$/;   /* anciennes formes, en dernier recours */
const RE_UPONLY = /^([A-ZÀ-Þ][A-ZÀ-Þ'’ ]{1,38})\s*$/;
const RE_ENDW = /^(?:FIN|RIDEAU|NOIR|Fin|Rideau|Noir)\s*[.!…]*$/;   /* seuls sur une ligne : didascalies */
const RE_ROMAN = /^(?=[IVX])X{0,3}(?:IX|IV|V?I{0,3})$/;
function nmOk(name, sep){
  const words = name.trim().split(/ +/), up = name === name.toUpperCase(), bare = !/[.:]/.test(sep);
  if (words.length > 5) return false;
  if (!up && bare && words.length > 4) return false;   /* comme avant : 4 mots au plus pour un nom en minuscules suivi d'un simple tiret */
  if (sep.trim() === '-' && !up && !words.every(w => /^[A-ZÀ-ÖØ-Þ\d]/.test(w))) return false;   /* « Il faut partir - vite. » reste une phrase */
  return true;
}
function normName(n){
  n = n.replace(/’/g, "'").replace(/\s+/g, ' ').trim();
  if (n !== n.toUpperCase()) return n;   /* pas tout en majuscules : écrit tel quel (« pH », « Jean-Pierre ») */
  const ws = n.split(' ');
  if (ws.length === 1 && /^[A-ZÀ-ÖØ-Þ]{1,2}$/.test(n)) return n;   /* sigle court : MC, PH */
  const cap = w => w.toLowerCase().replace(/(^|-)([a-zà-öø-ÿ])/g, (x, a, b) => a + b.toUpperCase());   /* majuscule au début et après un trait d'union */
  let after = false;
  return ws.map((w, i) => {
    let r;
    if (/^\d+$/.test(w) || (i > 0 && RE_ROMAN.test(w))) r = w;   /* chiffres et chiffres romains tels quels */
    else if (i === 0 || after) r = cap(w);
    else r = w.toLowerCase();
    after = NM_ABBR.includes(w.replace(/\.$/, ''));   /* « M. DUPONT » → « M. Dupont », « MME MARTIN » → « Mme Martin » */
    return r;
  }).join(' ');
}
function parseScript(raw){
  let src = String(raw).replace(/\r/g, '');
  const ti = src.search(/^#+\s*Texte\s*$/mi);
  if (ti >= 0) { src = src.slice(src.indexOf('\n', ti) + 1); const ne = src.search(/^#+\s/m); if (ne >= 0) src = src.slice(0, ne); }
  src = src.replace(/\[[^\]]*incertain[^\]]*\]/gi, '');
  const lines = src.split('\n').map(x => x.replace(/­/g, '').trim());
  const items = [], chars = [], counts = {}, canon = {};
  let cur = null;
  const flush = () => { cur = null; };
  const addChar = n => { const k = n.toLowerCase(); if (!canon[k]) { canon[k] = n; chars.push(n); counts[n] = 0; } return canon[k]; };
  const join = (a, b) => /[A-Za-zÀ-ÿ]-$/.test(a) && /^[a-zà-ÿ]/.test(b) ? a.slice(0, -1) + b : a + ' ' + b;
  lines.forEach(l => {
    if (!l || /^\d{1,3}$/.test(l) || /^#+\s/.test(l)) return;
    const em = l.match(/^\*([^*]+)\*$/);
    if (em) { flush(); items.push({ k:'dir', t:em[1].trim() }); return; }
    l = l.replace(/\*\*?([^*]+)\*\*?/g, '$1');
    if (RE_ENDW.test(l)) { flush(); items.push({ k:'dir', t:l }); return; }   /* FIN, RIDEAU, NOIR */
    let m, name = null, aside = '', txt = '';
    if ((m = l.match(RE_DASH)) && nmOk(m[1], m[4])) { name = m[1]; aside = m[2] || m[3] || ''; txt = m[5]; }
    else if ((m = l.match(RE_UP2)) && nmOk(m[1], ':')) { name = m[1]; aside = m[2] || ''; txt = m[3]; }
    else if ((m = l.match(RE_UPONLY2)) && nmOk(m[1], ':')) { name = m[1]; txt = ''; }
    else if ((m = l.match(RE_UP))) { name = m[1]; aside = m[2] || ''; txt = m[3]; }
    else if ((m = l.match(RE_UPONLY))) { name = m[1]; txt = ''; }
    if (name) {
      const c = addChar(normName(name));
      const t = ((aside ? '(' + aside.trim() + ') ' : '') + txt).trim();
      cur = { k:'l', c, t };
      items.push(cur); counts[c]++;
    } else if (cur) {
      cur.t = cur.t ? join(cur.t, l) : l;
    } else {
      items.push({ k:'dir', t:l });
    }
  });
  // fusionne les didascalies d’ouverture
  const out = [];
  items.forEach(it => { const last = out[out.length - 1];
    if (it.k === 'dir' && last && last.k === 'dir') last.t = join(last.t, it.t); else out.push(it); });
  return { items: out.filter(i => i.k === 'dir' || i.t), chars, counts };
}

  if (!play) { play = { id:'u' + Date.now(), title, author:I.author.trim() || '—', note:'Ajouté par moi', mine:true, season:saved.season, scenes:[] };
    saved.userLib.push(play); LIBRARY.push(play); }
  play.scenes.push({ id:'u' + Date.now() + play.scenes.length, title:scene, characters:pr.chars.slice(), roles:{}, items:pr.items });
  persist();

function impDelete(pid, sid){
  const p = saved.userLib.find(x => x.id === pid); if (!p) return;
  p.scenes = p.scenes.filter(x => x.id !== sid);
  const k = pid + '/' + sid;
  saved.mine = saved.mine.filter(x => x !== k && !(x && x.k === k));
  delete saved.me[k]; delete saved.prog[k]; delete saved.lines[k]; delete saved.notes[k];
  if (!p.scenes.length) {
    saved.userLib = saved.userLib.filter(x => x !== p);
    const i = LIBRARY.indexOf(p); if (i >= 0) LIBRARY.splice(i, 1);
  }
  persist();
}

function navBack(){
  const cf = document.getElementById('appcf'); if (cf) { cf._cancel(); return; }
  if (tmOpen) { tmCloseSheet(); return; }   /* 2.04 : le retour ferme d'abord le grand minuteur */
  const rw = document.querySelector('.rwl.on');
  if (rw) { if (rw._close) rw._close(); else rw.click(); return; }
  /* 2.04 : le retour referme d'abord les petites listes et menus ouverts */
  if (!S.settings) {
    if (S.nMenu != null) { S.nMenu = null; render(); return; }
    if (S.pick) { S.pick = false; render(); return; }
    if (S.pickK) { S.pickK = null; render(); return; }
    if (S.dpan) { S.dpan = false; render(); return; }
  }
  if (S.nEdit || S.nList) { S.nEdit = null; S.nList = false; render(); return; }
  if (S.nView != null) {
    const q = '.nb[data-i="' + S.nView + '"]', e = document.querySelector(q), t0 = e ? e.getBoundingClientRect().top : null;
    S.nView = null; render();
    if (t0 !== null) { const n = document.querySelector(q); if (n) window.scrollBy(0, n.getBoundingClientRect().top - t0); }
    return;
  }
  if (S.settings) { S.settings = false; try { sessionStorage.removeItem('repete.reopenSet'); } catch(e) {} renderSheet(); return; }
  if (S.view === 'badges' && S.bsel) { S.bsel = null; render(); return; }
  if (S.view === 'badges') { S.view = 'progress'; render(); window.scrollTo(0, 0); return; }
  if (S.view === 'rank') { S.view = 'progress'; render(); window.scrollTo(0, 0); return; }
  if (S.view === 'progress' || S.view === 'import') { S.view = 'library'; render(); window.scrollTo(0, 0); return; }
  if (S.view === 'scene') { if (canEndHere()) { endHere(); return; } stopSpeech(); if (S.started) S.started = false; else S.view = 'library'; render(); window.scrollTo(0, 0); }
}
/* Quitter l'appli : à l'accueil, un premier « retour » affiche un message, un second dans les 2 s quitte vraiment. */
let exitAt = 0, exitTimer = null;
function exitToast(){
  let t = document.getElementById('exittoast');
  if (!t) { t = document.createElement('div'); t.id = 'exittoast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
  t.textContent = 'Appuie encore sur retour pour quitter'; t.classList.add('on');
  clearTimeout(exitTimer); exitTimer = setTimeout(() => t.classList.remove('on'), 2000);
}
window.addEventListener('popstate', () => {
  if (leaving) return;
  if (jumping) { jumping = false; hlog('retour à l’entrée de départ'); return; }
  const cf = document.getElementById('appcf'); if (cf) { cf._cancel(); return; }
  const egg = typeof RepeteEgg !== 'undefined' && RepeteEgg.isOpen && RepeteEgg.isOpen();
  const deep = navDepth();
  const second = Date.now() - exitAt < 2000;
  hlog('retour reçu état=' + hst() + ' écran=' + S.view + (S.settings ? '+réglages' : '') + (egg ? ' jeu' : '') + ' → ' + (egg ? 'ferme le jeu' : deep ? 'ferme l’écran' : second ? 'QUITTE' : 'message'));
  if (egg) { RepeteEgg.requestClose ? RepeteEgg.requestClose() : RepeteEgg.close(); return; }
  if (deep) { navBack(); return; }
  if (second) {   // 2e appui rapproché (cas rare : il restait des sentinelles) : on quitte
    leaving = true;
    try { history.go(-(curIdx() - baseIdx + 1)); } catch(x) {}
    setTimeout(() => { try { window.close(); } catch(x) {} }, 400);
    setTimeout(() => { leaving = false; }, 1500);
    return;
  }
  /* Accueil, 1er appui : message, puis retour immédiat à l'entrée de départ. Le 2e appui n'a alors plus rien devant lui
     et quitte l'appli tout de suite (sinon il fallait traverser toutes les sentinelles : 3 appuis ou plus). */
  exitAt = Date.now(); exitToast();
  const n = curIdx() - baseIdx;
  if (n > 0) { jumping = true; try { history.go(-n); } catch(x) { jumping = false; } setTimeout(() => { jumping = false; }, 800); }
  clearTimeout(rearmT);
  rearmT = setTimeout(() => { try { if (curIdx() === baseIdx && !leaving) { hlog('message expiré : sentinelle remise'); history.pushState({ k: 'top', i: baseIdx + 1, a: baseIdx }, ''); } } catch(x) {} }, 2300);
});

/* Réglages : glisser vers le haut ferme la fenêtre (depuis le bas du contenu, ou depuis le fond assombri) */
let shSwipe = null;
document.addEventListener('touchstart', e => {
  shSwipe = null;
  if (!S.settings || e.touches.length !== 1) return;
  const t = e.target; if (!t || !t.closest || !t.closest('.sh-wrap')) return;
  if (t.closest('input[type=range],input[type=date]')) return;
  const pn = t.closest('.sh-panel');
  const atEnd = !pn || pn.scrollTop + pn.clientHeight >= pn.scrollHeight - 3;
  shSwipe = { y: e.touches[0].clientY, x: e.touches[0].clientX, ok: atEnd };
}, { passive: true });
document.addEventListener('touchend', e => {
  const g = shSwipe; shSwipe = null;
  if (!g || !g.ok || !S.settings || !e.changedTouches.length) return;
  const dy = e.changedTouches[0].clientY - g.y, dx = e.changedTouches[0].clientX - g.x;
  if (dy < -60 && Math.abs(dy) > Math.abs(dx) * 1.5) closeSettings();
}, { passive: true });

/* Réglages : tirer vers le bas depuis le haut = actualiser l'appli (revient dans les Réglages) */
let ptr = null;
document.addEventListener('touchstart', e => {
  ptr = null;
  if (!S.settings || e.touches.length !== 1) return;
  const pn = e.target && e.target.closest && e.target.closest('.sh-panel');
  if (pn && pn.scrollTop <= 0 && !e.target.closest('input[type=range],input[type=date]')) ptr = { y: e.touches[0].clientY, x: e.touches[0].clientX };
}, { passive: true });
let ptrDone = false;
const ptrGo = () => { if (ptrDone) return; ptrDone = true; try { sessionStorage.setItem('repete.reopenSet', '1'); } catch(x) {} location.reload(); };
document.addEventListener('touchmove', e => {
  if (!ptr || !S.settings || !e.touches.length) return;
  const dy = e.touches[0].clientY - ptr.y, dx = Math.abs(e.touches[0].clientX - ptr.x);
  if (dy < -20 || dx > 50) { ptr = null; return; }
  if (dy > 80 && dy > dx * 1.5) { ptr = null; ptrGo(); }   // se déclenche pendant le glissement (le navigateur peut annuler la fin du geste)
}, { passive: true });
document.addEventListener('touchend', e => {
  const g = ptr; ptr = null;
  if (!g || !S.settings || !e.changedTouches.length) return;
  const dy = e.changedTouches[0].clientY - g.y, dx = Math.abs(e.changedTouches[0].clientX - g.x);

let VOICES = [];
function loadVoices(){ if (!synth) return; try { VOICES = synth.getVoices().filter(v => /^fr/i.test(v.lang)); } catch(e){} }
loadVoices();
if (synth) { try { synth.onvoiceschanged = () => { loadVoices(); if (S.view==='scene' && S.tab==='reh' && !S.started) render(); }; } catch(e){} }

const PITCH = [1, 0.8, 1.25];
let ttsId = 0;
function say(text, pitch, idx){
  if (!synth) return;
  const id = ++ttsId;
  try {
    synth.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'fr-FR';
    const v = VOICES.find(v => v.name === S.voice) || VOICES.find(v => /fr-BE|fr-FR/i.test(v.lang)) || VOICES[0];
    if (v) u.voice = v;
    u.rate = S.rate; u.pitch = pitch || 1;
    S.tts = { status:'wait' }; S.speakI = idx === undefined ? null : idx; ttsMark();
    u.onstart = () => { if (id === ttsId) { S.tts = { status:'ok' }; } };
    u.onend = () => { if (id === ttsId) { S.speakI = null; ttsMark(); } };
    u.onerror = e => {
      if (id !== ttsId) return;
      const err = (e && e.error) || '';
      if (err === 'interrupted' || err === 'canceled') return;
      S.speakI = null; ttsMark();
      S.tts = { status:'err', msg:err }; refreshTts();
    };
    synth.speak(u);
    setTimeout(() => { if (id === ttsId && S.tts.status === 'wait') { S.tts = { status:'silent' }; S.speakI = null; refreshTts(); } }, 2500);
  } catch(e) { S.tts = { status:'err', msg:String(e) }; refreshTts(); }
}
function refreshTts(){ if (S.view === 'scene') render(); }
function speak(i){
  const it = S.scene.items[i]; if (!it || it.k !== 'l') return;
  say(spokenText(it.t), PITCH[Math.max(0, S.scene.characters.indexOf(it.c)) % PITCH.length], i);
}
function stopSpeech(){ ttsId++; try { synth && synth.cancel(); } catch(e){} S.speakI = null; try { ttsMark(); } catch(e) {} }
/* Les boutons de lecture (haut-parleur / Réécouter) deviennent « ■ Arrêter » pendant que cette réplique est lue */
const SQ = '<svg class="sq" width="9" height="9" viewBox="0 0 10 10" aria-hidden="true" style="flex:none"><rect width="10" height="10" rx="1.5" fill="currentColor"/></svg>';

    }
    const key = b.dataset.act === 'ttstest' ? 't' : +b.dataset.i, on = S.speakI != null && key === S.speakI, wide = /Ré|Tester|Écouter/.test(b.dataset.l);
