<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf7f2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Répète">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Répète — apprendre son texte de théâtre</title>
<style>
:root{
  --bg:#faf7f2;--card:#ffffff;--ink:#1f1b16;--mute:#645c52;--line:#e6dfd3;
  --accent:#f5a300;--accent-ink:#9a5a00;--accent-bg:#fff1cc;--on-accent:#2a1a00;--ok:#2f6f4f;--ko:#a33a2a;
}
:root{color-scheme:light dark}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
@media (prefers-color-scheme:dark){
  :root:not([data-theme=light]){--bg:#161412;--card:#201d1a;--ink:#f1ece4;--mute:#a39a8e;--line:#34302b;--accent:#f5a300;--accent-ink:#f5b335;--accent-bg:#3a2d10;--on-accent:#2a1a00;--ok:#6fcf9a;--ko:#f0907f;}
}
:root[data-theme=dark]{--bg:#161412;--card:#201d1a;--ink:#f1ece4;--mute:#a39a8e;--line:#34302b;--accent:#f5a300;--accent-ink:#f5b335;--accent-bg:#3a2d10;--on-accent:#2a1a00;--ok:#6fcf9a;--ko:#f0907f;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:640px;margin:0 auto;padding:12px 14px calc(24px + env(safe-area-inset-bottom));min-height:100vh}
button{font:inherit;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:inherit;cursor:pointer;touch-action:manipulation}
html{-webkit-text-size-adjust:100%}
button:disabled{opacity:.4;cursor:default}
h1{font-size:28px;margin:18px 0 2px;letter-spacing:-.01em}
h2{font-size:19px;margin:0 0 2px}
.sub,.mute{color:var(--mute)}
.sub{margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 14px}
.row{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;
  background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:10px;min-height:48px}
.row span:first-child{font-weight:600}
.row .mute{font-size:13px}
.tip{font-size:13px;color:var(--mute);margin-top:16px}

.bar{display:flex;align-items:center;gap:8px;margin:2px 0 10px}
.bt{font-weight:650;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ghost{background:none;border:0;padding:10px 6px;color:var(--accent-ink);font-weight:600;min-height:44px}

.who{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 12px 10px;margin-bottom:10px}
.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;line-height:1.15;background:var(--bg);
  border:1.5px solid var(--line);border-radius:12px;padding:8px 14px;min-height:46px;font-weight:650}
.chip small{font-weight:400;color:var(--mute);font-size:12px;margin-top:2px}
.chip.on{background:color-mix(in srgb,var(--accent) 9%,var(--bg));border:1.5px solid color-mix(in srgb,var(--accent) 60%,var(--line));color:var(--ink)}
.chip.on small{color:var(--mute);opacity:1}

.tabs{display:flex;background:var(--line);border-radius:12px;padding:3px;margin-bottom:12px}
.tabs button{flex:1;border:0;background:none;padding:10px;border-radius:10px;font-weight:650;min-height:44px;color:var(--ink);opacity:.72}
.tabs button.on{background:var(--card);color:var(--ink);opacity:1;box-shadow:0 1px 3px rgba(0,0,0,.12)}

.opts{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.seg{display:flex;border:1.5px solid color-mix(in srgb,var(--ink) 28%,transparent);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--card);padding:10px 6px;min-height:44px;font-weight:600;color:var(--ink)}
.seg button.on{background:var(--accent);color:var(--on-accent)}
.sw{display:flex;align-items:center;gap:10px;min-height:36px;font-size:15px}
.sw input{width:20px;height:20px;accent-color:var(--accent)}
.hint{color:var(--mute);font-size:14px;margin:6px 2px 12px}
.hint.big{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:22px;text-align:center;font-size:16px}

.script{font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;font-size:var(--sfs,18px);line-height:1.55}
.script p{margin:0}
.line{border-left:4px solid transparent;padding:8px 10px 8px 12px;margin:2px 0;border-radius:10px}
.line.me{background:color-mix(in srgb,var(--accent-bg) 45%,var(--bg));border-left-color:color-mix(in srgb,var(--accent) 65%,var(--bg))}
.who2{display:flex;align-items:center;gap:8px;font:700 12px system-ui,sans-serif;text-transform:uppercase;
  letter-spacing:.08em;color:var(--mute);margin-bottom:2px}
.line.me .who2{color:var(--mute)}
.line.ps.new{border-left-color:var(--mute)}
.line.ps.ko{border-left-color:#E5484D}
.line.ps.known{border-left-color:#22A06B}
.line.ps.solid{border-left-color:#F2B01E}
.stg{font-size:11px;font-weight:700;color:#B4560A;border:1.5px solid #E8710A;border-radius:6px;padding:1px 6px;text-transform:none;letter-spacing:0;white-space:nowrap}
.pgl{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--mute);margin:2px 0 6px}
.pgl .dot{width:9px;height:9px;margin-right:5px;vertical-align:-1px}
.mini{background:none;border:1px solid var(--line);border-radius:8px;padding:2px 8px;font:600 12px system-ui,sans-serif;
  color:var(--mute);text-transform:none;letter-spacing:0;min-height:28px}
.line.me .mini{border-color:var(--accent);color:var(--accent-ink)}
.dir,.aside{font-style:italic;color:var(--mute)}
.dir{font-size:16px;margin:10px 8px;text-align:center}
.cue{font-size:14px;color:var(--mute);margin:14px 4px 2px;padding-left:12px;border-left:2px solid var(--line)}
.cue .nm{font:700 11px system-ui,sans-serif;text-transform:uppercase;letter-spacing:.08em;margin-right:6px}
.note{font:13px/1.35 system-ui,sans-serif;color:var(--ko);margin-top:6px}
.mask{width:100%;border:1.5px dashed var(--accent);background:transparent;color:var(--accent-ink);
  border-radius:10px;padding:14px;font:600 14px system-ui,sans-serif;min-height:48px}

/* répétition */
.prog{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:2px 0 4px}
.prog i{display:block;height:100%;background:var(--accent)}
.pcount{font-size:13px;color:var(--mute);margin-bottom:10px;display:flex;justify-content:space-between}
.ctx{font-family:Georgia,serif;font-size:calc(var(--sfs,18px) - 3px);color:var(--mute);margin:0 0 8px;padding-left:12px;border-left:2px solid var(--line)}
.ctx .nm{font:700 11px system-ui,sans-serif;text-transform:uppercase;letter-spacing:.08em;margin-right:6px}
.cur{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:18px 16px;margin:10px 0 14px;
  font-family:Georgia,"Iowan Old Style",serif;font-size:var(--cfs,22px);line-height:1.5}
.cur.me{background:var(--accent-bg);border-color:var(--accent)}
.cur .who2{font-size:12px;margin-bottom:8px}
.cur .big{font:600 17px system-ui,sans-serif;color:var(--accent-ink)}
.cur .small{font:14px system-ui,sans-serif;color:var(--mute);margin-top:8px}
.actions{display:flex;gap:10px;position:sticky;bottom:0;padding:10px 0 calc(6px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,var(--bg) 75%,transparent)}
.btn{flex:1;min-height:54px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);font-weight:700;padding:0 14px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent);flex:2;font-size:17px}
.btn.ok{background:#1f8a5a;border-color:#1f8a5a;color:#fff;flex:2}
.btn.ko{background:#c2403a;border-color:#c2403a;color:#fff}
.btn.sm{min-height:44px;flex:0 0 auto;font-size:14px}
.row2{display:flex;gap:10px;margin-top:10px}
.set{display:flex;flex-direction:column;gap:12px}
.set label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--mute)}
.set select,.set input[type=range]{width:100%;min-height:40px;font:inherit;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:0 8px}
.set input[type=range]{padding:0;accent-color:var(--accent)}
.miss{margin:8px 0 0;padding-left:18px;font-size:14px;color:var(--mute)}
.miss li{margin:4px 0}

.ib{min-width:44px;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:15px;padding:0 8px}
.whoc{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 6px 8px 14px;margin-bottom:10px}
.whoc .grow{flex:1;min-width:0;line-height:1.25}
.whoc b{font-size:17px}
.btn.sq{flex:0 0 54px;font-size:22px;padding:0}
.btn.ko,.btn.ok{flex:1.4}
.cur.tap{cursor:pointer}
.mini.big{min-height:40px;padding:0 14px;font-size:14px}
.small{font-size:13px}
.mute.small{line-height:1.4}
.bar .ib{flex:0 0 auto}

.focus{display:flex;flex-direction:column;min-height:calc(100vh - 30px);min-height:calc(100dvh - 30px)}
.focus .actions{margin-top:auto}
.focus .cur{margin-bottom:20px}
.who2{flex-wrap:wrap}
.who2,.mini,.btn{white-space:nowrap}
.mini{min-height:34px;padding:2px 10px}
.btn.ok{font-size:15px}
.btn.ko{font-size:15px}
.card .row2 .btn{flex:1;min-width:0;padding:0 10px;font-size:15px}
.warnbox{background:var(--accent-bg);border:1px solid var(--accent);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.4;margin:6px 0 10px}
.bi{font-weight:800}
.num{display:inline-block;min-width:22px;text-align:center;font:700 11px/1.7 system-ui,sans-serif;letter-spacing:0;background:var(--line);color:var(--mute);border-radius:6px;padding:0 6px;margin-right:6px}
.line.me .num,.cur.me .num{background:var(--accent);color:var(--on-accent)}
.ib.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

.srow{display:flex;gap:8px;align-items:stretch;margin-top:10px}
.srow .row{margin-top:0;flex:1;width:auto;min-width:0}
.star{flex:0 0 52px;display:flex;align-items:center;justify-content:center;padding:0;border:1.5px dashed color-mix(in srgb,var(--ink) 30%,transparent);border-radius:10px;background:transparent;color:var(--mute)}
.star svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round}
.star.on{background:var(--accent-bg);border:2px solid var(--accent);color:var(--accent)}
.star.on svg{fill:currentColor}
.chip.sm{justify-content:center;align-items:center;text-align:center;min-height:40px;padding:6px 12px;font-size:14px}
.big2{font-size:22px;font-weight:700;margin:2px 0 8px}
.bar2{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:10px}
.bar2 .ghost{padding:6px;min-height:36px;font-size:14px}
.prog.ok i{background:var(--ok)}
.card .lbl{margin-top:2px}
.card.hero{background:color-mix(in srgb,var(--accent) 2%,var(--card));border:1.5px solid color-mix(in srgb,var(--accent) 55%,var(--line));padding:18px 16px;box-shadow:0 3px 14px color-mix(in srgb,var(--accent) 15%,transparent)}
.card.hero .lbl{color:var(--accent-ink);font-weight:800;font-size:13px}
.card.hero .big2{font-size:30px;line-height:1.1;margin:4px 0 10px}
.card.hero .prog{height:12px;border-radius:6px;background:color-mix(in srgb,var(--ink) 14%,transparent)}
.card.hero .pcount{font-size:14px;margin-top:6px}
.row em.me{font-style:normal;font-weight:700;color:var(--accent-ink)}
.row .chars{color:var(--ink);opacity:.8}

.hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hd h1{margin:18px 0 2px}
.ib svg{display:block;margin:0 auto}
.sh-wrap{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center}
.sh-back{position:absolute;inset:0;background:rgba(0,0,0,.45);opacity:0;transition:opacity .4s ease}
.sh-wrap.open .sh-back{opacity:1}
.sh-drop{position:relative;width:100%;max-width:640px;display:grid;grid-template-rows:0fr auto;transition:grid-template-rows .5s cubic-bezier(.3,.7,.2,1)}
.sh-wrap.open .sh-drop{grid-template-rows:1fr auto}
.sh-clip{min-height:0;overflow:hidden}
.sh-panel{background:var(--card);padding:calc(14px + env(safe-area-inset-top)) 16px 18px;max-height:82vh;max-height:82dvh;overflow:auto;-webkit-overflow-scrolling:touch}
.sh-roll{height:0;box-shadow:0 6px 16px rgba(0,0,0,.3)}
.sh-drop{border-radius:0 0 18px 18px}
.sh-clip{border-radius:0 0 18px 18px}
@media (prefers-reduced-motion:reduce){.sh-back,.sh-drop{transition:none}}
.sh-head{display:flex;justify-content:space-between;align-items:center}
.sh-head h2{margin:0;font-size:20px}
.sh-panel .lbl{margin:20px 0 10px;font-size:15px;font-weight:700;letter-spacing:.02em;text-transform:none;color:var(--ink)}
.sh-panel .lbl::before{content:'';display:inline-block;width:4px;height:14px;border-radius:2px;background:var(--accent);margin-right:8px;vertical-align:-1px}
.seg.sm button{font-size:14px;padding:10px 2px}
.sh-prev{margin:10px 0 4px}
.weak{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.weak > summary{font-weight:650;color:var(--ko);cursor:pointer;min-height:36px;display:flex;align-items:center}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;flex:none;vertical-align:middle}
.dot.new{border:1.5px solid var(--mute);background:transparent}
.dot.ko{background:#E5484D}
.dot.known{background:#22A06B}
.dot.solid{background:#F2B01E;box-shadow:0 0 0 1.5px #A87400}
.dot.stale{outline:2px solid #E8710A;outline-offset:1px}
.dots{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0 6px}
.legend{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:12.5px;color:var(--mute);margin-bottom:12px}
.legend .dot{margin-right:4px;width:9px;height:9px}
.legend .sep{opacity:.5}
.today{border-top:1px solid color-mix(in srgb,var(--accent) 40%,transparent);margin-top:12px;padding-top:10px;display:flex;flex-direction:column;gap:8px}
.tline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px}
.tk{font-weight:700}.tv{font-weight:700;color:var(--accent-ink)}
.tn{color:var(--mute);font-size:13px;flex:1;min-width:0}.tn.ok{color:#1f8a5a;font-weight:700}
.dim{filter:grayscale(1);opacity:.45}
.info{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--mute);background:none;color:var(--mute);font:700 13px/1 system-ui,sans-serif;padding:0;flex:none}
.tlist{display:flex;flex-direction:column;gap:6px}
.trow2{display:flex;align-items:center;gap:10px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;min-height:44px;font-size:14px}
.trow2 .ck{width:22px;height:22px;border-radius:50%;border:2px solid var(--mute);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex:none}
.trow2.done{border-color:#1f8a5a}.trow2.done .ck{background:#1f8a5a;border-color:#1f8a5a;color:#fff}
.trow2 .tt{flex:1;min-width:0}
.infobox{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13.5px;line-height:1.45}
.infobox p{margin:0 0 6px}.infobox p:last-child{margin:0}
.gain{font-size:14px;font-weight:700;color:#1f8a5a}
.hdtog{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:0;padding:0 0 2px;min-height:32px;text-align:left}
.hdtog .tg{font-size:13px;font-weight:700;color:var(--accent-ink)}
.lvrow{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:2px 0 10px}
.lvn{font-size:32px;font-weight:800;line-height:1.05}
.lvt{font-size:16px;font-weight:700;color:var(--accent-ink)}
.mline{font-size:14px;margin-top:6px}
.mline b{font-size:15px}
.goal{display:flex;gap:10px;align-items:baseline;margin-top:10px;font-size:14px}
.goal b{color:var(--accent-ink);font-size:16px}
.goal span{color:var(--mute)}
.big2 small{font-size:14px;font-weight:500;color:var(--mute)}
.wl{border-top:1px solid var(--line);margin-top:6px}
.wl summary{display:flex;gap:8px;align-items:center;min-height:40px;font-size:14px;cursor:pointer;list-style:none}
.wl summary::-webkit-details-marker{display:none}
.wl .wt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--mute)}
.wl .tag{font-size:11px;font-weight:700;color:#B4560A;border:1.5px solid #E8710A;border-radius:6px;padding:1px 6px;white-space:nowrap}
.wfull{padding:4px 2px 10px 19px}
.wfull .mute{margin-top:6px}
.bhead{display:flex;align-items:center;gap:8px;margin:0 0 12px}
.bhead h2{flex:1;margin:0;font-size:20px}
.bgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px}
.bcell{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 8px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;text-align:center}
.bcell.sel{border-color:var(--accent)}
.bn{font-weight:700;font-size:14px}
.bt{font-size:12px;color:var(--mute)}
.bdet h3{margin:0 0 4px;font-size:17px}.bdet p{margin:0 0 8px}
.bbtn{display:block;margin:2px 0 4px;padding:6px 0;min-height:36px}
.admtap{margin-top:22px;text-align:center;font-size:11px;color:var(--mute);opacity:.45;padding:10px;user-select:none}
.admask{display:flex;gap:8px;align-items:center}
.admask input,.admrow input{min-height:40px;font-size:16px;padding:6px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);width:100%}
.admbar{position:sticky;top:0;z-index:6;display:flex;justify-content:space-between;align-items:center;gap:8px;margin:-4px -4px 10px;padding:6px 10px;border-radius:10px;background:#3b3b46;color:#fff;font-size:12px}
.admbar button{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:8px;padding:6px 10px;font-weight:700;min-height:32px}
.admsec{margin-top:22px;padding-top:14px;border-top:1.5px dashed var(--line)}
.admrow{display:grid;grid-template-columns:1fr 84px 52px;gap:8px;align-items:center;margin-bottom:8px;font-size:14px}
.admgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.admb{min-height:40px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font-weight:600;font-size:13px;padding:6px 8px}
.admb.flash{background:var(--accent-bg);border-color:var(--accent);transition:none}
#admtoast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,16px);z-index:60;max-width:calc(100% - 32px);padding:10px 16px;border-radius:12px;background:#3b3b46;color:#fff;font-size:14px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;text-align:center}
#admtoast.show{opacity:1;transform:translate(-50%,0)}
.admb.dng{color:#b3261e}
.dateinp{width:100%;min-height:44px;font-size:16px;padding:8px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.weak > summary::after{content:'▾';margin-left:8px}
.weak[open] > summary::after{content:'▴'}

<script>
/*
 * Répète — sons des animations de récompense
 * ------------------------------------------------------------
 * 100 % synthétisé avec l'API Web Audio : aucun fichier audio, aucune librairie.
 *
 * Utilisation (au moment où tu ajoutes la classe `go`) :
 *   RepeteSons.ovation();            // fin de répétition
 *   RepeteSons.laurier(3);           // nouveau titre : 0 Figurant … 4 Tête d'affiche
 *   RepeteSons.badge('or');          // bronze | argent | or | platine | diamant | unique
 *
 * Réglages :
 *   RepeteSons.setEnabled(true|false);   // option « Sons des récompenses »
 *   RepeteSons.setVolume(0..1);          // 0.8 par défaut
 *   RepeteSons.unlock();                 // à appeler dans un geste utilisateur (iOS/Safari)
 *
 * Silence automatique si prefers-reduced-motion: reduce.
 * Le décalage de chaque son est calé sur la chronologie CSS des animations.
 */
(function (g) {
  'use strict';

  var ctx = null, master = null, verbIn = null, noiseBuf = null;
  var volume = 0.8, enabled = true;

  /* ---------- moteur ---------- */
  function reduced() {
    return g.matchMedia && g.matchMedia('(prefers-reduced-motion: reduce)').matches;
  }

  function impulse(sec, decay) {
    var sr = ctx.sampleRate, n = Math.floor(sr * sec), b = ctx.createBuffer(2, n, sr);
    for (var c = 0; c < 2; c++) {
      var d = b.getChannelData(c);
      for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, decay);
    }
    return b;
  }

  function init() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return ctx; }
    var AC = g.AudioContext || g.webkitAudioContext;
    if (!AC) return null;
    ctx = new AC();
    master = ctx.createGain();
    master.gain.value = volume;
    var comp = ctx.createDynamicsCompressor();
    master.connect(comp); comp.connect(ctx.destination);
    var verb = ctx.createConvolver();
    verb.buffer = impulse(1.9, 2.6);
    verbIn = ctx.createGain(); verbIn.gain.value = 0.4;
    verbIn.connect(verb); verb.connect(master);
    var n = ctx.sampleRate * 2;
    noiseBuf = ctx.createBuffer(1, n, ctx.sampleRate);
    var d = noiseBuf.getChannelData(0);
    for (var i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    return ctx;
  }

  function send(node, wet) {
    node.connect(master);
    if (wet > 0) {
      var s = ctx.createGain(); s.gain.value = wet;
      node.connect(s); s.connect(verbIn);
    }
  }

  /* oscillateur avec enveloppe : o = {a, sustain, to, glide, detune, lp:[f0,f1], wet} */
  function tone(f, t, d, type, v, o) {
    o = o || {};
    var osc = ctx.createOscillator(), gn = ctx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(f, t);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + (o.glide || d));
    if (o.detune) osc.detune.value = o.detune;
    var a = o.a || 0.005;
    gn.gain.setValueAtTime(0.0001, t);
    gn.gain.linearRampToValueAtTime(v, t + a);
    if (o.sustain) gn.gain.setValueAtTime(v, t + o.sustain);
    gn.gain.exponentialRampToValueAtTime(0.0001, t + d);
    if (o.lp) {
      var fl = ctx.createBiquadFilter();
      fl.type = 'lowpass';
      fl.frequency.setValueAtTime(o.lp[0], t);
      fl.frequency.linearRampToValueAtTime(o.lp[1], t + d * 0.6);
      osc.connect(fl); fl.connect(gn);
    } else osc.connect(gn);
    send(gn, o.wet || 0);
    osc.start(t); osc.stop(t + d + 0.05);
  }

  /* bruit filtré : le filtre glisse de f0 à f1 */
  function noise(t, d, type, f0, f1, v, q, wet) {
    var src = ctx.createBufferSource(), fl = ctx.createBiquadFilter(), gn = ctx.createGain();
    src.buffer = noiseBuf; src.loop = true;
    fl.type = type; fl.Q.value = q || 0.7;
    fl.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) fl.frequency.exponentialRampToValueAtTime(f1, t + d);
    gn.gain.setValueAtTime(0.0001, t);
    gn.gain.linearRampToValueAtTime(v, t + Math.min(0.01, d / 3));
    gn.gain.exponentialRampToValueAtTime(0.0001, t + d);
    src.connect(fl); fl.connect(gn); send(gn, wet || 0);
    src.start(t, Math.random()); src.stop(t + d + 0.05);
  }

  /* cloche : partiels inharmoniques */
  var BELL = [[1, 1, 1], [2.76, 0.5, 0.6], [5.4, 0.25, 0.35], [8.93, 0.12, 0.2]];
  function bell(f, t, v, d, wet) {
    for (var i = 0; i < BELL.length; i++)
      tone(f * BELL[i][0], t, d * BELL[i][2], 'sine', v * BELL[i][1], { a: 0.003, wet: wet });
  }

  /* bol chantant : plus pur, avec un battement */
  var BOWL = [[1, 1, 1], [2.71, 0.4, 0.6], [5.15, 0.15, 0.4]];
  function bowl(f, t, v, d, wet) {
    for (var i = 0; i < BOWL.length; i++) {
      tone(f * BOWL[i][0], t, d * BOWL[i][2], 'sine', v * BOWL[i][1], { a: 0.01, wet: wet });
      if (i === 0) tone(f * 1.004, t, d, 'sine', v * 0.6, { a: 0.01, wet: wet });
    }
  }

  function go(fn) {
    if (!enabled || reduced()) return;
    if (!init()) return;
    fn(ctx.currentTime + 0.06);
  }

  /* ---------- 1 · Ovation — « Scène terminée » : rideau, projecteur, cordes ---------- */
  function ovation() {
    go(function (t) {
      // 0,05 s : le projecteur s'allume — « poum » de scène, sans bourdonnement
      tone(80, t + 0.05, 0.22, 'sine', 0.24, { to: 52, wet: 0.2 });
      noise(t + 0.05, 0.05, 'lowpass', 900, 400, 0.08);

      // 0,1 → 0,9 s : le rideau de velours s'ouvre — froissement doux qui monte puis retombe
      var src = ctx.createBufferSource(), bp = ctx.createBiquadFilter(), lp = ctx.createBiquadFilter(), gn = ctx.createGain();
      src.buffer = noiseBuf; src.loop = true;
      bp.type = 'bandpass'; bp.Q.value = 0.9;
      bp.frequency.setValueAtTime(180, t + 0.1);
      bp.frequency.exponentialRampToValueAtTime(950, t + 0.9);
      lp.type = 'lowpass'; lp.frequency.value = 1800;
      gn.gain.setValueAtTime(0.0001, t + 0.1);
      gn.gain.linearRampToValueAtTime(0.16, t + 0.5);
      gn.gain.linearRampToValueAtTime(0.0001, t + 1.0);
      src.connect(bp); bp.connect(lp); lp.connect(gn); send(gn, 0.35);
      src.start(t + 0.1, Math.random()); src.stop(t + 1.05);

      // 0,3 → 2,3 s : accord de cordes MONTANT — les notes entrent de bas en haut (ré majeur ajouté d'une neuvième),
      // chacune glisse légèrement vers sa hauteur, et l'accord s'ouvre (filtre) en montant
      [146.8, 220, 293.7, 370, 440, 587.3, 740, 880].forEach(function (f, i) {
        var st = t + 0.3 + i * 0.13;
        [-7, 0, 7].forEach(function (dt) {
          tone(f * 0.94, st, 2.1 - i * 0.13, 'sawtooth', 0.014,
            { a: 0.22, sustain: 1.1, to: f, glide: 0.3, detune: dt, lp: [450 + i * 80, 1500 + i * 250], wet: 0.55 });
        });
      });

      // 1,3 s : la note la plus haute, douce, au sommet de la montée
      tone(1174.7, t + 1.3, 1.6, 'triangle', 0.07, { a: 0.006, wet: 0.65 });
      tone(2349, t + 1.3, 0.5, 'sine', 0.012, { a: 0.004, wet: 0.65 });
    });
  }

  /* ---------- 2 · Laurier — nouveau titre ---------- */
  var ROOTS = [196, 220, 246.9, 261.6, 293.7];   // Figurant … Tête d'affiche
  var HARP = [1, 9 / 8, 5 / 4, 3 / 2, 5 / 3, 2, 9 / 4, 5 / 2, 3];
  var PENTA = [1, 9 / 8, 5 / 4, 3 / 2, 5 / 3];

  function laurier(titleIdx) {
    var root = ROOTS[Math.max(0, Math.min(4, titleIdx | 0))];
    go(function (t) {
      // 0,05 → 0,95 s : la tige se dessine — glissando de harpe
      HARP.forEach(function (r, i) {
        var f = root * 2 * r, ti = t + 0.05 + i * 0.1;
        tone(f, ti, 1.3, 'triangle', 0.15, { a: 0.004, wet: 0.5 });
        tone(f * 2, ti, 0.5, 'sine', 0.04, { a: 0.003, wet: 0.5 });
      });
      // 0,1 → 0,75 s : les feuilles apparaissent — petits tics de clochette
      for (var i = 0; i < 12; i++) {
        var f = root * 4 * PENTA[i % 5] * (i >= 5 ? 2 : 1);
        tone(f, t + 0.1 + i * 0.057, 0.22, 'sine', 0.035, { a: 0.002, wet: 0.3 });
      }
      // 0,7 s : le nœud se pose — timbale et cymbale frappée
      tone(120, t + 0.7, 0.55, 'sine', 0.42, { to: 62, glide: 0.3 });
      noise(t + 0.7, 0.14, 'lowpass', 500, 200, 0.22);
      noise(t + 0.7, 1.0, 'highpass', 6500, 6500, 0.05, 0.7, 0.6);

      // 0,85 s : le titre — accord de cuivres tenu
      [1, 5 / 4, 3 / 2, 2].forEach(function (r) {
        [-6, 6].forEach(function (dt) {
          tone(root * 2 * r, t + 0.85, 1.6, 'sawtooth', 0.03,
            { a: 0.14, sustain: 0.9, detune: dt, lp: [700, 2300], wet: 0.4 });
        });
      });
      // étincelles
      bell(root * 8, t + 0.95, 0.04, 0.6, 0.4);
      bell(root * 10, t + 1.05, 0.035, 0.6, 0.4);
      // 1,35 s : « Niveau »
      bell(root * 4, t + 1.35, 0.2, 2.3, 0.6);
    });
  }

  /* ---------- 3 · Badge — rotation 3D ---------- */
  var BASE = { bronze: 220, argent: 293.7, or: 329.6, platine: 392, diamant: 523.3, unique: 261.6 };

  function badge(tier) {
    var base = BASE[tier] || BASE.or, uni = tier === 'unique';
    go(function (t) {
      // 0 s : entrée de la médaille
      tone(300, t, 0.1, 'sine', 0.3, { to: 120 });

      // 0,1 → 1,5 s : rotation — souffle qui accélère puis ralentit
      var src = ctx.createBufferSource(), fl = ctx.createBiquadFilter(), gn = ctx.createGain();
      src.buffer = noiseBuf; src.loop = true;
      fl.type = 'bandpass'; fl.Q.value = 1.4;
      fl.frequency.setValueAtTime(300, t + 0.1);
      fl.frequency.exponentialRampToValueAtTime(3000, t + 0.54);
      fl.frequency.exponentialRampToValueAtTime(500, t + 1.5);
      gn.gain.setValueAtTime(0.0001, t + 0.1);
      gn.gain.linearRampToValueAtTime(0.2, t + 0.54);
      gn.gain.linearRampToValueAtTime(0.0001, t + 1.5);
      src.connect(fl); fl.connect(gn); send(gn, 0.2);
      src.start(t + 0.1, Math.random()); src.stop(t + 1.55);

      // 0,54 s : médaille de chant — « tchink », la couleur change
      bell(base * 6, t + 0.54, 0.14, 0.4, 0.3);
      noise(t + 0.54, 0.03, 'highpass', 5000, 5000, 0.1);

      // 1,05 s : le motif se grave
      noise(t + 1.05, 0.03, 'highpass', 3000, 3000, 0.16);
      tone(1200, t + 1.05, 0.06, 'triangle', 0.1, { to: 700 });

      // 1,5 s : reflet — « shing »
      noise(t + 1.5, 0.28, 'highpass', 3000, 9000, 0.1, 0.9, 0.3);

      // 1,55 et 1,74 s : les deux ondes — bols chantants
      bowl(base * 2, t + 1.55, 0.2, 2.2, 0.6);
      bowl(base, t + 1.74, 0.17, 2.4, 0.6);

      // 1,55 → 1,72 s : scintillements — célesta
      var P = [1, 9 / 8, 5 / 4, 3 / 2, 5 / 3, 2, 9 / 4, 5 / 2];
      for (var i = 0; i < 8; i++) {
        var f = base * 4 * P[i];
        tone(f, t + 1.55 + i * 0.024, 0.6, 'sine', 0.045, { a: 0.002, wet: 0.5 });
        tone(f * 2, t + 1.55 + i * 0.024, 0.25, 'sine', 0.015, { a: 0.002, wet: 0.5 });
      }

      // 1,65 s : texte — accord final (nappe mystérieuse pour les badges uniques)
      var chord = uni ? [1, 1.2, 1.5, 1.8, 2.4] : [1, 1.25, 1.5, 2];
      chord.forEach(function (r) {
        tone(base * r, t + 1.65, uni ? 2.2 : 1.5, uni ? 'triangle' : 'sine', uni ? 0.05 : 0.06,
          { a: uni ? 0.2 : 0.05, wet: 0.5, lp: uni ? [500, 1800] : null });
        tone(base * r * 2, t + 1.65, 1.2, 'sine', 0.015, { a: 0.05, wet: 0.5 });
      });
    });
  }

  g.RepeteSons = {
    ovation: ovation,
    laurier: laurier,
    badge: badge,
    unlock: init,
    setEnabled: function (b) { enabled = !!b; },
    isEnabled: function () { return enabled; },
    setVolume: function (v) { volume = Math.max(0, Math.min(1, v)); if (master) master.gain.value = volume; }
  };
})(window);

</script>
<script>
/* ============ DONNÉES ============ */
const D = t => ({k:'dir', t});
const L = (c, t, note) => ({k:'l', c, t, note});

const LIBRARY = [{
  id:'breves',
  title:'Brèves de trottoirs',
  author:'Jean-Pierre Martinez',
  note:'La Comédiathèque, 2014',
  scenes:[{
    id:'3',
    title:'3. La rue est à tout le monde',
    characters:['Religieuse','Travesti'],
    roles:{Religieuse:'Martine, déguisée',Travesti:'Jérôme, déguisé'},
    items:(() => {
      const R = 'Religieuse', T = 'Travesti';
      return [
        D(`Un homme travesti en femme, genre prostituée, fait le pied de grue sur le trottoir. Une religieuse arrive. Elle semble désagréablement surprise de voir le travesti.`),
        L(R,`Qu’est-ce que vous foutez là ?`),
        L(T,`Ça ne se voit pas ?`),
        L(R,`Ce n’est pas la rue Saint-Denis, ici. Vous ne trouvez pas que vous détonnez un peu dans le paysage ?`),
        L(T,`Vous êtes de la police ?`),
        L(R,`Pas exactement…`),
        L(T,`La rue est à tout le monde, non ?`),
        D(`L’autre lui tend un billet.`),
        L(R,`Bon, tenez, voilà un billet de dix. Prenez ça et tirez-vous, d’accord ?`),
        D(`L’autre regarde le billet, surpris, mais ne le prend pas.`),
        L(T,`Merci ma sœur, c’est très généreux de votre part. Mais je vais être obligé de rester.`),
        L(R,`Je vous demande juste de vous déplacer jusqu’au bout de la rue !`),
        L(T,`Oui, mais désolé, ça ne va pas être possible.`),
        D(`L’autre réfléchit un instant, agacée, puis se décide.`),
        L(R,`Bon, c’est combien la pipe ?`),
        L(T,`Pourquoi ? Ça vous intéresse ?`),
        D(`L’autre sort deux billets de vingt euros et les lui tend.`),
        L(R,`Voilà deux billets de vingt euros. Vous voyez, ma voiture est au coin de la rue. Si vous alliez voir par là-bas si j’y suis ? Vous n’aurez qu’à considérer que vous êtes en train de travailler…`),
        L(T,`Mais puisque je vous dis que non.`),
        L(R,`Et pourquoi ça ?`),
        L(T,`Parce que j’ai une bonne raison de ne pas bouger d’ici, voilà pourquoi.`),
        L(R,`Quelle raison ?`),
        L(T,`Je vous en pose des questions, moi ?`),
        L(R,`Je ne vous empêche pas de m’en poser. Pourvu qu’après vous dégagiez d’ici.`),

      D(`Deux balayeurs. Ils balaient. L’un ramasse quelque chose par terre.`),

      L('Deux',`Et c’est quoi, ces chiffres ?`),

  const items = S.scene.items, si = S.steps[S.pos], it = items[si];
  const mine = it.c === S.me;
  const prevs = []; for (let j = si-1; j >= 0 && prevs.length < 2; j--) if (items[j].k==='l') prevs.unshift(j);
  const from = prevs.length ? prevs[prevs.length-1] + 1 : 0;
  const dirs = []; for (let j = from; j < si; j++) if (items[j].k==='dir') dirs.push(items[j].t);
  const hide = gradable(si) && !S.stepRevealed;
  const pct = Math.round(S.pos / S.steps.length * 100);
  let card;
  if (hide) {
    const w = words(it.t);
    card = `<div class="cur me tap" data-act="reveal-step" role="button" tabindex="0"><div class="who2"><span class="num">${lineNo(si)}</span>${esc(it.c)} · à toi</div>
      <div class="big">Dis ta réplique de mémoire.</div>
      <div class="small">${w.length} mot${w.length>1?'s':''}${S.hint ? ` — commence par : « ${esc(w.slice(0,3).join(' '))}… »` : ' · touche la carte pour la révéler'}</div>
      ${S.hint ? '' : `<div class="row2"><button class="btn sm" data-act="hint">Indice</button></div>`}</div>`;
  } else {
    card = `<div class="cur ${mine?'me':''}"><div class="who2"><span class="num">${lineNo(si)}</span>${esc(it.c)}${mine?' · toi':''}${!mine?`<button class="mini" data-act="${synth ? 'speak' : 'nosound'}" data-i="${si}">🔊 Réécouter</button>`:''}</div>
      ${fmt(it.t)}${it.note?`<p class="note">${esc(it.note)}</p>`:''}</div>`;
  }
  const prevBtn = `<button class="btn sq" data-act="prev" ${S.pos===0?'disabled':''} aria-label="Réplique précédente">‹</button>`;
  let actions;
  if (hide) actions = prevBtn + `<button class="btn pri" data-act="reveal-step">Afficher ma réplique</button>`;
  else if (gradable(si)) actions = prevBtn + `<button class="btn ko" data-act="grade" data-v="ko">À revoir</button><button class="btn ok" data-act="grade" data-v="ok">Je connais</button>`;
  else actions = prevBtn + `<button class="btn pri" data-act="next">Suivant ›</button>`;
  return `<div class="prog"><i style="width:${pct}%"></i></div>
    <div class="pcount"><span>Réplique ${S.pos+1} / ${S.steps.length}</span><span>${S.missed.size ? S.missed.size + ' à revoir' : ''}</span></div>
    ${prevs.map(j => `<p class="ctx"><b class="nm">${lineNo(j)} · ${esc(items[j].c)}</b>${fmt(items[j].t)}</p>`).join('')}
    ${dirs.map(d => `<p class="dir">${fmt(d)}</p>`).join('')}
    ${card}
    <div class="actions">${actions}</div>`;
}
function doneView(){
  const items = S.scene.items, miss = [...S.missed].sort((a,b)=>a-b);
  const mineTotal = S.focus ? S.focus.size : S.steps.filter(i => items[i].c === S.me).length;
  return `<div class="card"><h2>Scène terminée 🎭</h2>
    ${S.rehHide ? `${S.stepsAll ? `<p>Sues du premier coup : <b>${mineTotal - miss.length} / ${mineTotal}</b></p>` : ''}
    <p>${miss.length === 0 ? 'Aucune réplique à revoir, bravo.' : `${miss.length} réplique${miss.length>1?'s':''} à revoir :`}</p>
    ${miss.length ? `<ol class="miss">${miss.map(i=>`<li value="${lineNo(i)}">${esc(tail(items[i].t))}</li>`).join('')}</ol>` : ''}` : `<p class="mute">Tu as parcouru les ${S.steps.length} répliques.</p>`}
    <div class="row2">
      <button class="btn pri" data-act="start">Recommencer</button>
    </div>
    <div class="row2"><button class="btn" data-act="totext">Retour au texte</button></div></div>`;
}

/* ============ ACTIONS ============ */
function beginSteps(steps, pos, all, focus){
  S.focus = focus || null; S.steps = steps; S.pos = pos || 0; S.stepsAll = all !== false; S.started = true; S.done = false; S.stepRevealed = false; S.hint = false;
  S.tab = 'reh'; saveProg();
  render(); window.scrollTo(0,0); autoSpeak();
}
function autoSpeak(){
  if (!S.audio || !synth || !S.started || S.done) return;
  const it = S.scene.items[S.steps[S.pos]];
  if (it && it.c !== S.me) speak(S.steps[S.pos]);
}
function step(d){
  stopSpeech();
  const n = S.pos + d;
  if (n < 0) return;
  if (n >= S.steps.length) { if (S.stepsAll && S.me && !S.done) { saved.bgc = saved.bgc || {}; saved.bgc.scenes = (saved.bgc.scenes || 0) + 1; celebrate('applause', { scene:S.scene.title }); } S.done = true; saveProg(); render(); window.scrollTo(0,0); return; }
  S.pos = n; S.stepRevealed = false; S.hint = false; saveProg();
  render(); window.scrollTo(0,0); autoSpeak();
}
function grade(v){
  const si = S.steps[S.pos];
  if (v === 'ko') S.missed.add(si); else S.missed.delete(si);
  const L = saved.lines[mKey(S.play, S.scene, S.me)] = saved.lines[mKey(S.play, S.scene, S.me)] || {};
  ensureDay();
  const r0 = L[si] = L[si] || { n:0, ok:null, ko:false }, day = today();
  r0.g = day;
  if (v === 'ko') { r0.n = 0; r0.ko = true; r0.ok = null; }
  else { r0.ko = false; if (r0.ok !== day) { r0.n = Math.min(5, r0.n + 1); r0.ok = day; } }
  checkDay();
  persist();
  step(1);
}
function primary(swipe){
  if (!isFocus() || S.done) return;
  const g = gradable(S.steps[S.pos]);
  if (g && !S.stepRevealed) { S.stepRevealed = true; render(); return; }
  if (g) { if (!swipe) grade('ok'); return; }
  step(1);
}

document.addEventListener('click', e => {
  if (soundOn()) { try { RepeteSons.unlock(); } catch(x) {} }
  const b = e.target.closest('[data-act]');
  if (!b || b.tagName === 'INPUT' || b.tagName === 'SELECT') return;
  const a = b.dataset.act;
  if (a !== 'admtap' && !b.classList.contains('sh-back')) buzz(a === 'adm' ? 'ok' : 'tap');
  switch (a) {
    case 'setanim': saved.anim = b.dataset.v; persist(); render(); break;
    case 'admpick': S[b.dataset.k] = +b.dataset.v; renderSheet(); break;
    case 'admanim': if (b.dataset.v === 'allbadges' || b.dataset.v === 'alltiers') {
      const list = b.dataset.v === 'allbadges' ? BADGES.map(x => [x, S.admTier || 3]) : [1,2,3,4,5].map(n => [BADGES[S.admB || 0], n]);
      list.forEach(([bg, tr]) => celebrate('badge', { id:bg.id, name:bg.name, tier:tr, unique:!!bg.unique, label:bg.name })); break; }
      { const k = b.dataset.v, bg = BADGES[S.admB || 0], ti = S.admT == null ? 3 : S.admT;
      celebrate(k, k === 'title' ? { title:TITLE_IDX[ti], lvl:[10,20,30,40,50][ti] } : k === 'badge' ? { id:bg.id, name:bg.name, tier:S.admTier || 3, unique:!!bg.unique, label:bg.name } : { scene:'Test' }); break; }
    case 'setsound': saved.sound = b.dataset.v; persist(); render(); if (saved.sound === 'on') rwSound(() => { RepeteSons.unlock(); RepeteSons.badge('or'); }); break;
    case 'installapp': {
      const ev = installEvt; if (!ev) break;
      ev.prompt();
      Promise.resolve(ev.userChoice).then(c => { installEvt = null; if (S.settings) renderSheet(); }).catch(() => {});
      break;
    }
    case 'sethaptic': saved.haptic = b.dataset.v; persist(); render(); buzz('tap'); break;
    case 'open': {
      S.play = LIBRARY.find(p => p.id === b.dataset.play);
      S.scene = S.play.scenes.find(s => s.id === b.dataset.scene);
      const m = saved.me[key()];
      S.me = S.scene.characters.includes(m) ? m : null;
      Object.assign(S, {view:'scene', tab:'text', mode:'all', textHide:false, pick:false, started:false, steps:[], pos:0, done:false, revealed:new Set(), missed:new Set()});
      saved.last = { play:S.play.id, scene:S.scene.id }; persist();
      if (b.dataset.go && S.me) S.tab = 'reh';
      render(); window.scrollTo(0,0); break; }
    case 'admtap': S.admTaps = (S.admTaps || 0) + 1; if (S.admTaps >= 5) { S.admAsk = true; S.admTaps = 0; renderSheet(); } break;
    case 'admgo': { const v = ($('#admcode') || {}).value || ''; if (admHash(v) === ADM_OK) { try { localStorage.setItem('repete.active', 'admin'); } catch(e) {} location.reload(); } else { S.admErr = true; renderSheet(); } break; }
    case 'admquit': try { localStorage.setItem('repete.active', 'main'); } catch(e) {} location.reload(); break;
    case 'adm': { const op = b.dataset.op; let v = b.dataset.v !== undefined ? +b.dataset.v : 0;
      if (b.dataset.in) { const el = document.getElementById(b.dataset.in); if (!el || el.value === '') break; v = Math.max(0, +el.value); if (op === 'mastery') v = Math.min(100, v); }
      admOp(op, v); admFeedback(op, v, b.dataset.v); break; }
    case 'badgesopen': S.view = 'badges'; S.bsel = null; render(); window.scrollTo(0, 0); break;
    case 'badgesback': S.view = 'library'; render(); window.scrollTo(0, 0); break;
    case 'badgesel': S.bsel = b.dataset.id; render(); break;
    case 'settings': S.settings = true; renderSheet(); break;
    case 'closesettings': S.settings = false; renderSheet(); break;
    case 'setfs': S.fs = +b.dataset.v; applyFs(); persist(); render(); break;
    case 'settheme': saved.theme = b.dataset.v; applyTheme(); persist(); render(); break;
    case 'setcolor': saved.color = b.dataset.v; applyTheme(); persist(); render(); break;
    case 'togglehero': saved.heroOpen = !saved.heroOpen; persist(); render(); break;
    case 'infoobj': S.infoObj = !S.infoObj; render(); break;
    case 'libtab': saved.libTab = b.dataset.v; persist(); render(); window.scrollTo(0,0); break;
    case 'togglemine': {
      const k = b.dataset.play + '/' + b.dataset.scene, i = saved.mine.indexOf(k);
      if (i < 0) saved.mine.push(k); else saved.mine.splice(i, 1);
      persist(); render(); break; }
    case 'setme': saved.me[b.dataset.play + '/' + b.dataset.scene] = b.dataset.c; persist(); render(); break;
    case 'back': stopSpeech(); S.view = 'library'; S.started = false; render(); window.scrollTo(0,0); break;
    case 'leave': stopSpeech(); S.started = false; render(); window.scrollTo(0,0); break;
    case 'pick': S.pick = true; render(); break;
    case 'me':
      S.me = b.dataset.c || null; S.pick = false; S.mode = (S.me ? S.mode : 'all'); S.revealed = new Set();
      S.started = false; S.steps = []; S.pos = 0; S.done = false; S.missed = new Set();
      saved.me[key()] = S.me; persist(); render(); break;
    case 'tab': stopSpeech(); S.tab = b.dataset.v; render(); break;
    case 'mode': S.mode = b.dataset.v; render(); break;
    case 'reveal': S.revealed.add(+b.dataset.i); render(); break;
    case 'rehide': S.revealed = new Set(); render(); break;
    case 'speak': speak(+b.dataset.i); break;
    case 'nosound': S.tts = { status:'unsupported' }; render(); break;
    case 'ttstest': say('Bonjour, ceci est un test de la voix.', 1); break;
    case 'bold': S.bold = !S.bold; persist(); render(); break;
    case 'fs': S.fs = (S.fs + 1) % FS.length; applyFs(); persist(); break;
    case 'audiotoggle': S.audio = !S.audio; persist(); if (!S.audio) stopSpeech(); else autoSpeak(); render(); break;
    case 'from': { const all = allSteps(); S.missed = new Set(); beginSteps(all, Math.max(0, all.indexOf(+b.dataset.i)), true); break; }
    case 'start': S.missed = new Set(); beginSteps(allSteps(), 0, true); break;
    case 'resume': {
      const p = saved.prog[key()];
      S.missed = new Set((p && p.missed) || []);
      beginSteps(allSteps(), Math.min(p ? p.pos : 0, countLines(S.scene) - 1), true); break; }
    case 'totext': stopSpeech(); S.started = false; S.tab = 'text'; render(); window.scrollTo(0,0); break;
    case 'hint': S.hint = true; render(); break;
    case 'reveal-step': S.stepRevealed = true; render(); break;
    case 'prev': step(-1); break;
    case 'next': step(1); break;
    case 'grade': grade(b.dataset.v); break;
  }
});
document.addEventListener('input', e => {
  const t = e.target; if (t.dataset && t.dataset.act === 'rate') { const v = parseFloat(t.value).toFixed(1); const el = document.getElementById('rateval'); if (el) el.textContent = v; }
});
document.addEventListener('change', e => {
  const t = e.target, a = t.dataset && t.dataset.act; if (!a) return;
  if (a === 'showprog') { saved.showProg = t.checked; persist(); render(); }
  else if (a === 'thide') { S.textHide = t.checked; S.revealed = new Set(); render(); }
  else if (a === 'cue') { S.cue = t.checked; render(); }
  else if (a === 'boldck') { S.bold = t.checked; persist(); render(); }
  else if (a === 'audio') { S.audio = t.checked; persist(); render(); }
  else if (a === 'voice') { S.voice = t.value; persist(); }
  else if (a === 'goaldate') { if (t.value) { saved.goalDate = t.value; persist(); render(); } }
  else if (a === 'rate') { S.rate = parseFloat(t.value); persist(); render(); }
});

/* gestes : glisser vers la gauche = suivante, vers la droite = précédente */
let tx = 0, ty = 0, tt = 0;
document.addEventListener('touchstart', e => { const t = e.changedTouches[0]; tx = t.clientX; ty = t.clientY; tt = Date.now(); }, {passive:true});
document.addEventListener('touchend', e => {
  if (!isFocus() || S.done) return;
  const t = e.changedTouches[0], dx = t.clientX - tx, dy = t.clientY - ty;
  if (Math.abs(dx) < 70 || Math.abs(dy) > 60 || Date.now() - tt > 600) return;
  if (dx < 0) primary(true); else step(-1);
}, {passive:true});
/* clavier */
document.addEventListener('keydown', e => {
  if (!isFocus() || S.done || e.target.closest('input,select,textarea')) return;
  const onBtn = !!e.target.closest('button,[role=button]');
  if (e.key === 'ArrowRight' || ((e.key === ' ' || e.key === 'Enter') && !onBtn)) { e.preventDefault(); primary(false); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); step(-1); }
  else if (e.key === 'r' || e.key === 'R') { const si = S.steps[S.pos]; if (S.scene.items[si].c !== S.me) speak(si); }
  else if ((e.key === 'i' || e.key === 'I') && !S.hint) { S.hint = true; render(); }
  else if ((e.key === 'x' || e.key === 'X') && S.stepRevealed && gradable(S.steps[S.pos])) grade('ko');
});
document.addEventListener('visibilitychange', () => { if (document.hidden) stopSpeech(); });
render();
</script>
<script>
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
</script>
